<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>HR OTT — Watch Now</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg: #0b0b0f; --bg-2: #101015; --bg-card: #16161c; --red: #E50914; --red-dark: #B20710; --red-glow: rgba(229,9,20,0.45); --gold: #f5c518; --text: #ffffff; --text-muted: #b3b3b3; --text-dim: #7c7c85; --green: #46d369; --poster-min: clamp(104px, 14vw, 172px); }
        * { margin:0; padding:0; box-sizing:border-box; }
        html { scroll-behavior:smooth; -webkit-tap-highlight-color:transparent; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; overflow-x: hidden; min-height: 100vh; -webkit-font-smoothing: antialiased; }
        
        .nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; padding: 16px clamp(16px, 3vw, 50px); display: flex; align-items: center; gap: 20px; background: linear-gradient(180deg, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.5) 70%, rgba(0,0,0,0) 100%); }
        .nav.scrolled { background: rgba(11,11,15,0.98); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(255,255,255,0.08); padding: 10px clamp(16px, 3vw, 50px); }
        .nav-logo { font-family: 'Bebas Neue', sans-serif; font-size: 1.6rem; font-weight: 900; color: var(--red); letter-spacing: 2px; text-transform: uppercase; cursor: pointer; text-shadow: 0 0 20px var(--red-glow); text-decoration: none; }
        .nav-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
        .btn-back { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; background: rgba(255,255,255,0.1); color: var(--text); text-decoration: none; border-radius: 6px; font-weight: 600; font-size: 13px; transition: all 0.2s ease; border: 1px solid rgba(255,255,255,0.15); cursor: pointer; }
        .btn-back:hover { background: var(--red); border-color: var(--red); }
        .profile-avatar { width: 32px; height: 32px; border-radius: 6px; background: linear-gradient(135deg, var(--red), #4a0408); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; box-shadow: 0 4px 14px var(--red-glow); }
        
        .player-wrapper { width: 100%; padding-bottom: 60px; margin: 0; display: flex; flex-direction: column; }
        .media-hero { position: relative; width: 100%; height: 65vh; overflow: hidden; display: flex; align-items: flex-end; min-height: 300px; }
        .hero-backdrop { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center; filter: brightness(0.3) blur(1px); z-index: 0; }
        .hero-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, rgba(11, 11, 15, 0) 0%, rgba(11, 11, 15, 0.5) 70%, rgba(11, 11, 15, 0.95) 100%); z-index: 1; }
        .hero-content { position: relative; z-index: 2; display: grid; grid-template-columns: 200px 1fr; gap: 24px; width: 100%; max-width: 1400px; padding: 30px clamp(16px, 4vw, 80px); align-items: flex-end; margin: 0 auto; }
        .hero-poster { width: 200px; height: 300px; border-radius: 10px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.9); border: 1px solid rgba(255,255,255,0.15); background: var(--bg-card); flex-shrink: 0; }
        .hero-poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .hero-info { display: flex; flex-direction: column; gap: 14px; flex: 1; max-width: 650px; }
        .hero-title { font-size: clamp(1.8rem, 4.5vw, 3.2rem); font-weight: 900; line-height: 1; letter-spacing: -2px; text-shadow: 0 4px 20px rgba(0,0,0,0.8); }
        .hero-meta { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; font-weight: 600; font-size: 0.9rem; }
        .meta-item { display: flex; align-items: center; gap: 6px; }
        .meta-item.match { color: var(--green); font-weight: 700; }
        .maturity-badge { border: 2px solid rgba(255,255,255,0.5); padding: 3px 10px; border-radius: 4px; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; }
        .hero-genres { display: flex; gap: 8px; flex-wrap: wrap; }
        .genre-tag { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2); border-radius: 20px; padding: 4px 12px; font-size: 0.8rem; font-weight: 600; }
        .hero-description { max-width: 550px; color: rgba(255,255,255,0.85); line-height: 1.6; font-size: 0.9rem; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .player-section { background: var(--bg); padding: 20px clamp(16px, 4vw, 80px); max-width: 1400px; margin: 0 auto; width: 100%; }
        
        .server-section { margin-bottom: 12px; }
        .server-label { font-size: 0.75rem; font-weight: 800; color: rgba(255,255,255,0.7); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; display: block; }
        .server-tabs { display: flex; gap: 6px; flex-wrap: wrap; min-height: 32px; align-items: center; width: 100%; overflow-x: auto; padding-bottom: 4px; }
        .server-btn { background: transparent; border: 1.5px solid rgba(255,255,255,0.2); color: var(--text-muted); padding: 4px 10px; border-radius: 5px; cursor: pointer; font-weight: 600; font-size: 0.7rem; transition: all 0.2s ease; font-family: 'Inter', sans-serif; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; flex-shrink: 0; }
        .server-btn:hover { background: rgba(255,255,255,0.08); color: var(--text); border-color: rgba(255,255,255,0.4); }
        .server-btn.active { background: var(--red); border-color: var(--red); color: #fff; }
        .server-btn.videasy { border-color: var(--green); color: var(--green); }
        
        .player-wrapper-outer { position: relative; margin-bottom: 20px; background: #0a0a0e; border-radius: 10px; overflow: hidden; border: 1px solid rgba(255,255,255,0.08); }
        .player-title-bar { padding: 8px 14px; background: rgba(255,255,255,0.03); border-bottom: 1px solid rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; min-height: 40px; }
        .player-title-bar .title { font-weight: 700; font-size: 0.85rem; color: var(--text); display: flex; align-items: center; gap: 8px; }
        .player-title-bar .title .badge { font-size: 0.55rem; font-weight: 800; text-transform: uppercase; padding: 2px 6px; border-radius: 3px; background: var(--red); color: #fff; }
        .player-title-bar .title .content-type-badge { font-size: 0.55rem; font-weight: 800; text-transform: uppercase; padding: 2px 6px; border-radius: 3px; background: var(--gold); color: #000; }
        .player-title-bar .controls { display: flex; gap: 4px; }
        .player-title-bar .controls .player-btn { appearance: none; border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.06); color: var(--text); border-radius: 4px; padding: 4px 10px; font-weight: 600; font-size: 0.7rem; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; transition: all 0.2s ease; font-family: 'Inter', sans-serif; }
        .player-title-bar .controls .player-btn:hover { background: var(--red); border-color: var(--red); }
        
        .player-container { width: 100%; max-width: 100%; background: #000; position: relative; aspect-ratio: 16 / 9; display: flex; align-items: center; justify-content: center; min-height: 250px; overflow: hidden; }
        .player-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; border: none; background: #000; }
        .player-loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: linear-gradient(135deg, #1a1a1f 0%, #2a2a32 100%); z-index: 10; transition: opacity 0.3s ease; }
        .player-loading.hidden { opacity: 0; pointer-events: none; }
        .spinner { width: 40px; height: 40px; border: 3px solid rgba(229, 9, 20, 0.15); border-top-color: var(--red); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { font-size: 0.9rem; font-weight: 700; }
        .loading-subtext { font-size: 0.75rem; color: var(--text-muted); }
        
        #adDisclaimer { display: flex !important; visibility: visible !important; opacity: 1 !important; align-items: flex-start; gap: 12px; background: rgba(229, 9, 20, 0.1); border: 1px solid rgba(229, 9, 20, 0.3); border-radius: 8px; padding: 12px 16px; margin: 20px 0; font-size: 0.85rem; color: rgba(255,255,255,0.85); line-height: 1.6; position: relative; z-index: 5; }
        #adDisclaimer i { color: var(--red); font-size: 1.1rem; flex-shrink: 0; margin-top: 3px; }
        #adDisclaimer .ad-disclaimer-content { flex: 1; }
        #adDisclaimer .ad-disclaimer-content strong { display: inline-block; margin-bottom: 4px; }
        #adDisclaimer .ad-disclaimer-content p { margin: 0; }
        
        .cast-section { margin: 30px 0 20px 0; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); }
        .cast-section h3, .similar-section h3, .details-section h3, .episode-guide h3 { font-size: 1.1rem; margin-bottom: 14px; color: var(--text); font-weight: 800; }
        .cast-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 16px; }
        .cast-member { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .cast-avatar { width: 90px; height: 90px; border-radius: 50%; background: var(--bg-card); border: 2px solid rgba(229, 9, 20, 0.2); overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .cast-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .cast-avatar-placeholder { width: 100%; height: 100%; background: var(--bg-elevated); display: flex; align-items: center; justify-content: center; color: var(--text-dim); font-size: 1.8rem; }
        .cast-name { font-size: 0.8rem; font-weight: 700; }
        .cast-character { font-size: 0.7rem; color: var(--text-muted); }
        .details-section { margin: 30px 0 20px 0; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); }
        .details-section p { color: rgba(255,255,255,0.8); font-size: 0.9rem; line-height: 1.7; max-width: 900px; }
        .similar-section { margin: 30px 0 20px 0; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); }
        .similar-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--poster-min), 1fr)); gap: 8px; }
        .similar-card { position: relative; cursor: pointer; border-radius: 6px; overflow: hidden; background: var(--bg-card); transition: transform 0.3s ease; text-decoration: none; color: var(--text); }
        .similar-card:hover { transform: scale(1.05); z-index: 10; }
        .similar-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; }
        .similar-card-overlay { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 50%, rgba(0,0,0,0.9) 100%); opacity: 0; transition: opacity 0.3s ease; display: flex; flex-direction: column; justify-content: flex-end; padding: 8px; }
        .similar-card:hover .similar-card-overlay { opacity: 1; }
        .similar-card-title { font-weight: 700; font-size: 0.75rem; }
        .similar-card-rating { font-size: 0.65rem; color: var(--gold); }
        
        .toast { position: fixed; bottom: 30px; right: 30px; background: rgba(11, 11, 15, 0.98); color: white; padding: 10px 16px; border-radius: 6px; border-left: 3px solid var(--red); z-index: 9999; font-size: 12px; font-weight: 600; box-shadow: 0 8px 30px rgba(0,0,0,0.8); display: flex; align-items: center; gap: 8px; animation: slideIn 0.25s ease; }
        @keyframes slideIn { from { transform: translateX(400px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        
        @media (max-width: 768px) {
            .nav { padding: 10px 12px; gap: 8px; }
            .nav-logo { font-size: 1.1rem; }
            .btn-back { font-size: 0.65rem; padding: 5px 8px; }
            .btn-back span { display: none; }
            .media-hero { height: 55vh; min-height: 250px; }
            .hero-content { grid-template-columns: 1fr; gap: 12px; padding: 16px 12px 30px; }
            .hero-poster { width: 120px; height: 180px; margin: 0 auto; }
            .hero-title { font-size: 1.5rem; }
            .player-section { padding: 16px 12px; }
            .server-btn { padding: 3px 8px; font-size: 0.65rem; }
            .player-container { min-height: 160px; }
            #adDisclaimer { padding: 10px 12px; font-size: 0.8rem; }
            .cast-grid { grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); }
            .cast-avatar { width: 70px; height: 70px; }
            .similar-grid { grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); }
        }
    </style>
</head>
<body>
    <nav class="nav" id="mainNav">
        <a href="/" class="nav-logo">HR OTT</a>
        <div class="nav-right">
            <a href="/" class="btn-back"><i class="fas fa-arrow-left"></i><span>Back</span></a>
            <div class="profile-avatar">HR</div>
        </div>
    </nav>

    <div class="player-wrapper">
        <div class="media-hero" id="mediaHero">
            <div class="hero-backdrop" id="heroBackdrop"></div>
            <div class="hero-overlay"></div>
            <div class="hero-content">
                <div class="hero-poster"><img id="posterImg" src="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 200 300%22%3E%3Crect fill=%22%231a1a20%22 width=%22200%22 height=%22300%22/%3E%3C/svg%3E" alt="Poster"></div>
                <div class="hero-info">
                    <h1 class="hero-title" id="titleText">Loading...</h1>
                    <div class="hero-meta" id="metaRow"></div>
                    <div class="hero-genres" id="genresRow"></div>
                    <p class="hero-description" id="overviewText">Loading description...</p>
                </div>
            </div>
        </div>

        <div class="player-section">
            <div class="server-section">
                <label class="server-label"><i class="fas fa-server"></i> Select Stream Source</label>
                <div class="server-tabs" id="serverTabs"></div>
            </div>

            <div class="player-wrapper-outer">
                <div class="player-title-bar" id="playerTitleBar">
                    <div class="title" id="playerTitle">
                        <span id="playerTitleText">Loading...</span>
                        <span class="badge">HD</span>
                        <span class="content-type-badge" id="contentTypeBadge"></span>
                    </div>
                    <div class="controls">
                        <button class="player-btn" id="playerReloadBtn"><i class="fas fa-redo"></i><span>Reload</span></button>
                        <button class="player-btn" id="playerFullscreenBtn"><i class="fas fa-expand"></i><span>Fullscreen</span></button>
                    </div>
                </div>
                
                <div class="player-container" id="playerContainer">
                    <div class="player-loading" id="playerLoading">
                        <div class="spinner"></div>
                        <div class="loading-text">Loading Player</div>
                        <div class="loading-subtext" id="loadingSubtext">Initializing stream...</div>
                    </div>
                </div>
            </div>

            <div id="adDisclaimer" style="display: flex !important; visibility: visible !important; opacity: 1 !important;">
                <i class="fas fa-ban"></i>
                <div class="ad-disclaimer-content">
                    <strong><i class="fas fa-shield-alt"></i> HR OTT is completely ad-free!</strong>
                    <p>HR OTT is completely free and we never run ads. Any ad or new tab you see comes from the video server itself.</p>
                </div>
            </div>

            <div class="cast-section" id="castSection">
                <h3><i class="fas fa-users"></i> Characters</h3>
                <div class="cast-grid" id="castGrid"></div>
            </div>

            <div class="details-section" id="detailsSection">
                <h3><i class="fas fa-video"></i> Description</h3>
                <p id="descText"></p>
            </div>

            <div class="similar-section" id="similarSection">
                <h3 id="similarTitle"><i class="fas fa-film"></i> Similar Content</h3>
                <div class="similar-grid" id="similarGrid"></div>
            </div>
        </div>
    </div>

    <script>
        'use strict';
        (function() {
            // ═══════════════════════════════════════════════
            // ═══ ANILIST API CONFIGURATION ═══
            // ═══════════════════════════════════════════════
            const ANILIST_API = 'https://graphql.anilist.co';
            const ANILIST_CLIENT_ID = '48862';
            const ANILIST_CLIENT_SECRET = 'IltRyhs54AtI7ydt7au24r079OCS9g5Hv5bMJzFb';
            
            // ═══════ TMDB CONFIG ═══════
            const TMDB_KEY = '3a87b1db63bc74b8e3fe9266ddc75b30';
            const TMDB_BASE = 'https://api.themoviedb.org/3';
            const TMDB_IMG = 'https://image.tmdb.org/t/p/w500';
            const TMDB_BACKDROP = 'https://image.tmdb.org/t/p/w1280';

            // ═══════ SOURCE CONFIG ═══════
            const sourceConfig = [
                { 
                    id: 1, 
                    displayName: 'Videasy', 
                    isVideasy: true,
                    movie: t => `https://player.videasy.net/movie/${t}`,
                    tv: (t,s,e) => `https://player.videasy.net/tv/${t}/${s}/${e}`,
                    animeShow: (t,e) => `https://player.videasy.net/anime/${t}/${e}`,
                    animeMovie: t => `https://player.videasy.net/anime/${t}`
                },
                { 
                    id: 2, 
                    displayName: 'Vidzee', 
                    isVideasy: false,
                    movie: t => `https://player.vidzee.wtf/embed/movie/${t}`, 
                    tv: (t,s,e) => `https://player.vidzee.wtf/embed/tv/${t}/${s}/${e}` 
                },
                { 
                    id: 3, 
                    displayName: 'VidSrc.sbs', 
                    isVideasy: false,
                    movie: t => `https://vidsrc.sbs/embed/movie/${t}`, 
                    tv: (t,s,e) => `https://vidsrc.sbs/embed/tv/${t}/${s}/${e}` 
                }
            ];

            let currentId = null;
            let currentType = 'movie';
            let currentSeason = 1;
            let currentEpisode = 1;
            let currentSource = 1;
            let isLoading = false;
            const playerSources = {};

            // ═══════ HELPERS ═══════
            function showToast(msg) {
                const t = document.createElement('div');
                t.className = 'toast';
                t.innerHTML = `<i class="fas fa-check-circle"></i>${msg}`;
                document.body.appendChild(t);
                setTimeout(() => t.remove(), 2500);
            }

            function buildIframe(src) {
                const i = document.createElement('iframe');
                i.src = src;
                i.allow = 'autoplay; fullscreen; encrypted-media; picture-in-picture';
                i.allowFullscreen = true;
                i.setAttribute('allowfullscreen', 'true');
                i.referrerPolicy = 'no-referrer';
                i.loading = 'eager';
                return i;
            }

            // ═══════════════════════════════════════════════
            // ═══ ANILIST API FUNCTIONS ═══
            // ═══════════════════════════════════════════════
            async function fetchAniListData(anilistId) {
                const query = `
                    query ($id: Int) {
                        Media(id: $id, type: ANIME) {
                            id
                            title {
                                romaji
                                english
                                native
                            }
                            description
                            coverImage {
                                extraLarge
                                large
                                color
                            }
                            bannerImage
                            format
                            episodes
                            duration
                            status
                            season
                            seasonYear
                            averageScore
                            meanScore
                            popularity
                            genres
                            studios {
                                nodes {
                                    name
                                }
                            }
                            characters(sort: ROLE, perPage: 12) {
                                nodes {
                                    id
                                    name {
                                        full
                                    }
                                    image {
                                        large
                                    }
                                }
                                edges {
                                    role
                                }
                            }
                            recommendations(sort: RATING_DESC, perPage: 12) {
                                nodes {
                                    mediaRecommendation {
                                        id
                                        title {
                                            romaji
                                        }
                                        coverImage {
                                            large
                                        }
                                        averageScore
                                        format
                                    }
                                }
                            }
                        }
                    }
                `;
                
                try {
                    const response = await fetch(ANILIST_API, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json',
                            'Client-ID': ANILIST_CLIENT_ID,
                            'Client-Secret': ANILIST_CLIENT_SECRET
                        },
                        body: JSON.stringify({
                            query: query,
                            variables: { id: anilistId }
                        })
                    });
                    
                    if (!response.ok) throw new Error('AniList API error');
                    const data = await response.json();
                    return data.data.Media;
                } catch (e) {
                    console.error('AniList fetch error:', e);
                    return null;
                }
            }

            function stripHtml(html) {
                const tmp = document.createElement('div');
                tmp.innerHTML = html;
                return tmp.textContent || tmp.innerText || '';
            }

            // ═══════ BUILD SOURCE URL ═══════
            function buildSourceUrl(cfg) {
                switch(currentType) {
                    case 'movie':
                        return cfg.movie ? cfg.movie(currentId) : null;
                    case 'tv':
                        return cfg.tv ? cfg.tv(currentId, currentSeason, currentEpisode) : null;
                    case 'anime-show':
                        return cfg.animeShow ? cfg.animeShow(currentId, currentEpisode) : null;
                    case 'anime-movie':
                        return cfg.animeMovie ? cfg.animeMovie(currentId) : null;
                    default:
                        return null;
                }
            }

            function refreshPlayerSources() {
                Object.keys(playerSources).forEach(k => delete playerSources[k]);
                sourceConfig.forEach(cfg => {
                    const url = buildSourceUrl(cfg);
                    if (url) {
                        playerSources[cfg.id] = { url, displayName: cfg.displayName, isVideasy: cfg.isVideasy };
                    }
                });
            }

            function updateContentTypeBadge() {
                const badge = document.getElementById('contentTypeBadge');
                if (!badge) return;
                switch(currentType) {
                    case 'movie': badge.textContent = 'MOVIE'; break;
                    case 'tv': badge.textContent = `S${currentSeason} E${currentEpisode}`; break;
                    case 'anime-show': badge.textContent = `EP ${currentEpisode}`; break;
                    case 'anime-movie': badge.textContent = 'ANIME MOVIE'; break;
                }
            }

            // ═══════ PLAYER LOAD ═══════
            function loadPlayerEmbed(key) {
                if (isLoading || !currentId) return;
                isLoading = true;
                refreshPlayerSources();
                const source = playerSources[key];
                if (!source) { isLoading = false; return; }
                currentSource = key;
                const container = document.getElementById('playerContainer');
                const oldIframe = container.querySelector('iframe');
                if (oldIframe) { try { oldIframe.src = 'about:blank'; oldIframe.remove(); } catch(e) {} }
                const loading = document.getElementById('playerLoading');
                loading.classList.remove('hidden');
                document.getElementById('loadingSubtext').textContent = `Loading ${source.displayName}...`;
                const iframe = buildIframe(source.url);
                iframe.onload = () => { loading.classList.add('hidden'); isLoading = false; };
                iframe.onerror = () => { loading.classList.add('hidden'); isLoading = false; };
                container.appendChild(iframe);
                document.querySelectorAll('.server-btn').forEach(b => b.classList.toggle('active', parseInt(b.dataset.source) === key));
            }

            function initServerButtons() {
                const container = document.getElementById('serverTabs');
                if (!container) return;
                container.innerHTML = '';
                Object.entries(playerSources).forEach(([k, s]) => {
                    const b = document.createElement('button');
                    b.className = `server-btn ${parseInt(k) === currentSource ? 'active' : ''} ${s.isVideasy ? 'videasy' : ''}`;
                    b.dataset.source = k;
                    b.type = 'button';
                    b.innerHTML = `<i class="fas fa-${s.isVideasy ? 'play-circle' : 'server'}"></i> ${s.displayName}`;
                    b.onclick = () => loadPlayerEmbed(parseInt(k));
                    container.appendChild(b);
                });
            }

            // ═══════ FETCH TMDB DETAILS ═══════
            async function fetchTMDBDetails(id, type) {
                try {
                    const endpoint = type === 'movie' ? `/movie/${id}?append_to_response=credits` : `/tv/${id}?append_to_response=credits`;
                    const res = await fetch(`${TMDB_BASE}${endpoint}&api_key=${TMDB_KEY}`);
                    if (!res.ok) return false;
                    const data = await res.json();
                    const title = data.title || data.name || 'Untitled';
                    const year = (data.release_date || data.first_air_date || '').substring(0,4);
                    const match = data.vote_average ? Math.round(data.vote_average * 10) : 0;
                    const rating = data.vote_average ? Number(data.vote_average).toFixed(1) : '?';
                    const runtime = data.runtime || (data.episode_run_time?.[0]) || '?';
                    const poster = data.poster_path ? TMDB_IMG + data.poster_path : '';
                    const backdrop = data.backdrop_path ? TMDB_BACKDROP + data.backdrop_path : poster;
                    const overview = data.overview || 'No description available.';
                    const genres = data.genres || [];
                    const cast = data.credits?.cast || [];
                    
                    document.title = `${title} - HR OTT`;
                    document.getElementById('titleText').textContent = title;
                    if (poster) document.getElementById('posterImg').src = poster;
                    document.getElementById('overviewText').textContent = overview;
                    document.getElementById('descText').textContent = overview;
                    document.getElementById('heroBackdrop').style.backgroundImage = `url('${backdrop}')`;
                    document.getElementById('metaRow').innerHTML = `
                        <div class="meta-item match">${match}% Match</div>
                        <div class="meta-item">${year}</div>
                        <div class="meta-item"><span class="maturity-badge">${rating}</span></div>
                        <div class="meta-item">${runtime} min</div>`;
                    document.getElementById('genresRow').innerHTML = genres.map(g => `<div class="genre-tag">${g.name}</div>`).join('');
                    
                    // Render cast
                    const castGrid = document.getElementById('castGrid');
                    castGrid.innerHTML = '';
                    cast.slice(0, 12).forEach(member => {
                        const castEl = document.createElement('div');
                        castEl.className = 'cast-member';
                        const photoUrl = member.profile_path ? `${TMDB_IMG}${member.profile_path}` : null;
                        castEl.innerHTML = `
                            <div class="cast-avatar">
                                ${photoUrl ? `<img src="${photoUrl}" alt="${member.name}" loading="lazy">` : `<div class="cast-avatar-placeholder"><i class="fas fa-user"></i></div>`}
                            </div>
                            <div class="cast-name">${member.name}</div>
                            ${member.character ? `<div class="cast-character">${member.character}</div>` : ''}`;
                        castGrid.appendChild(castEl);
                    });
                    
                    updateContentTypeBadge();
                    return true;
                } catch (e) {
                    console.error('TMDB fetch error:', e);
                    return false;
                }
            }

            // ═══════ FETCH ANILIST DETAILS ═══════
            async function fetchAnimeDetails(anilistId) {
                const media = await fetchAniListData(anilistId);
                if (!media) {
                    document.getElementById('titleText').textContent = 'Anime not found';
                    return;
                }
                
                const title = media.title.english || media.title.romaji || 'Untitled';
                document.title = `${title} - HR OTT`;
                document.getElementById('titleText').textContent = title;
                
                // Description
                const desc = stripHtml(media.description || 'No description available.');
                document.getElementById('overviewText').textContent = desc;
                document.getElementById('descText').textContent = desc;
                
                // Poster
                if (media.coverImage?.extraLarge) {
                    document.getElementById('posterImg').src = media.coverImage.extraLarge;
                }
                
                // Backdrop
                if (media.bannerImage) {
                    document.getElementById('heroBackdrop').style.backgroundImage = `url('${media.bannerImage}')`;
                } else if (media.coverImage?.extraLarge) {
                    document.getElementById('heroBackdrop').style.backgroundImage = `url('${media.coverImage.extraLarge}')`;
                }
                
                // Meta info
                const format = media.format || 'ANIME';
                const episodes = media.episodes || '?';
                const duration = media.duration || '?';
                const score = media.averageScore ? (media.averageScore / 10).toFixed(1) : '?';
                const year = media.seasonYear || '?';
                
                document.getElementById('metaRow').innerHTML = `
                    <div class="meta-item match"><i class="fas fa-star"></i> ${score}</div>
                    <div class="meta-item">${year}</div>
                    <div class="meta-item"><span class="maturity-badge">${format}</span></div>
                    <div class="meta-item">${episodes} eps</div>
                    <div class="meta-item">${duration} min</div>`;
                
                // Genres
                document.getElementById('genresRow').innerHTML = (media.genres || []).map(g => `<div class="genre-tag">${g}</div>`).join('');
                
                // Characters
                const castGrid = document.getElementById('castGrid');
                castGrid.innerHTML = '';
                if (media.characters?.nodes) {
                    media.characters.nodes.forEach((char, i) => {
                        const role = media.characters.edges?.[i]?.role || 'Character';
                        const castEl = document.createElement('div');
                        castEl.className = 'cast-member';
                        castEl.innerHTML = `
                            <div class="cast-avatar">
                                ${char.image?.large ? `<img src="${char.image.large}" alt="${char.name.full}" loading="lazy">` : `<div class="cast-avatar-placeholder"><i class="fas fa-user"></i></div>`}
                            </div>
                            <div class="cast-name">${char.name.full}</div>
                            <div class="cast-character">${role}</div>`;
                        castGrid.appendChild(castEl);
                    });
                }
                
                // Similar content
                const similarGrid = document.getElementById('similarGrid');
                similarGrid.innerHTML = '';
                if (media.recommendations?.nodes) {
                    media.recommendations.nodes.forEach(rec => {
                        const recMedia = rec.mediaRecommendation;
                        if (!recMedia) return;
                        const card = document.createElement('a');
                        card.className = 'similar-card';
                        card.href = `?id=${recMedia.id}&type=anime-show&title=${encodeURIComponent(recMedia.title.romaji)}`;
                        card.innerHTML = `
                            <img src="${recMedia.coverImage?.large || ''}" alt="${recMedia.title.romaji}" loading="lazy">
                            <div class="similar-card-overlay">
                                <div class="similar-card-title">${recMedia.title.romaji}</div>
                                ${recMedia.averageScore ? `<div class="similar-card-rating"><i class="fas fa-star"></i> ${(recMedia.averageScore/10).toFixed(1)}</div>` : ''}
                            </div>`;
                        card.addEventListener('click', (e) => { e.preventDefault(); window.location.href = card.href; });
                        similarGrid.appendChild(card);
                    });
                }
                
                updateContentTypeBadge();
            }

            // ═══════ EVENT LISTENERS ═══════
            let navTimeout;
            window.addEventListener('scroll', () => {
                clearTimeout(navTimeout);
                navTimeout = setTimeout(() => {
                    document.getElementById('mainNav')?.classList.toggle('scrolled', window.scrollY > 50);
                }, 50);
            }, { passive: true });

            document.getElementById('playerFullscreenBtn')?.addEventListener('click', function(e) {
                e.preventDefault();
                const container = document.getElementById('playerContainer');
                if (!document.fullscreenElement) {
                    container?.requestFullscreen?.();
                } else {
                    document.exitFullscreen?.();
                }
            });

            document.getElementById('playerReloadBtn')?.addEventListener('click', function(e) {
                e.preventDefault();
                loadPlayerEmbed(currentSource);
                showToast('Reloading player...');
            });

            // ═══════ MAIN INIT ═══════
            async function init() {
                const adDisclaimer = document.getElementById('adDisclaimer');
                if (adDisclaimer) {
                    adDisclaimer.style.cssText = 'display: flex !important; visibility: visible !important; opacity: 1 !important;';
                }
                
                const urlParams = new URLSearchParams(window.location.search);
                const pathParts = window.location.pathname.split('/').filter(p => p);
                
                let id = urlParams.get('id') || pathParts[1] || null;
                let type = (urlParams.get('type') || pathParts[2] || 'movie').toLowerCase();
                let season = parseInt(urlParams.get('s') || '1');
                let episode = parseInt(urlParams.get('e') || '1');
                
                // Handle anime types
                if (type === 'anime' || type === 'anime-show') {
                    currentType = 'anime-show';
                } else if (type === 'anime-movie') {
                    currentType = 'anime-movie';
                }
                
                if (!id) {
                    document.getElementById('titleText').textContent = 'Error: No ID';
                    document.getElementById('overviewText').textContent = 'Please provide a media ID in the URL.';
                    return;
                }
                
                currentId = id;
                currentSeason = season;
                currentEpisode = episode;
                currentSource = 1;
                
                refreshPlayerSources();
                initServerButtons();
                
                // Fetch details based on content type
                if (currentType === 'movie' || currentType === 'tv') {
                    await fetchTMDBDetails(id, currentType);
                } else {
                    await fetchAnimeDetails(id);
                }
                
                // Load player
                setTimeout(() => {
                    loadPlayerEmbed(1);
                }, 100);
                
                console.log('🎬 HR OTT Player - AniList API Integrated');
            }

            init();
        })();
    </script>
</body>
</html>
