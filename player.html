<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>HR OTT — Watch Now</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0b0b0f;
            --bg-2: #101015;
            --bg-card: #16161c;
            --bg-elevated: #23232c;
            --red: #E50914;
            --red-dark: #B20710;
            --red-glow: rgba(229,9,20,0.45);
            --gold: #f5c518;
            --text: #ffffff;
            --text-muted: #b3b3b3;
            --text-dim: #7c7c85;
            --green: #46d369;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }

        html { 
            scroll-behavior: auto;
            -webkit-tap-highlight-color: transparent; 
            overflow-y: scroll;
            width: 100%;
            height: 100%;
        }

        body {
            background:
                radial-gradient(1200px 600px at 80% -10%, rgba(229,9,20,0.08), transparent 60%),
                var(--bg);
            color: var(--text);
            font-family: 'Inter', system-ui, sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            -webkit-font-smoothing: subpixel-antialiased;
            -moz-osx-font-smoothing: grayscale;
            will-change: auto;
            width: 100%;
        }

        /* ── Navbar ── */
        .nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            padding: 20px clamp(20px, 3vw, 50px);
            display: flex;
            align-items: center;
            gap: 24px;
            background: linear-gradient(180deg, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.5) 70%, rgba(0,0,0,0) 100%);
            transition: background 0.3s ease, padding 0.3s ease;
            border-bottom: 1px solid transparent;
            will-change: background;
            contain: layout style paint;
            width: 100%;
            height: auto;
        }

        .nav.scrolled {
            background: rgba(11,11,15,0.95);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            padding: 12px clamp(20px, 3vw, 50px);
        }

        .nav-logo {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--red);
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            text-shadow: 0 0 20px var(--red-glow);
            user-select: none;
            text-decoration: none;
            transition: transform 0.2s ease;
            will-change: transform;
            flex-shrink: 0;
            white-space: nowrap;
        }

        .nav-logo:hover { transform: scale(1.05); }

        .nav-right {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-shrink: 0;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            background: rgba(255,255,255,0.1);
            color: var(--text);
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s ease;
            border: 1px solid rgba(255,255,255,0.15);
            cursor: pointer;
            will-change: background, border-color;
            white-space: nowrap;
            height: fit-content;
        }

        .btn-back:hover { background: var(--red); border-color: var(--red); }

        .adblock-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: rgba(70, 211, 105, 0.15);
            border: 1px solid rgba(70, 211, 105, 0.3);
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--green);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            flex-shrink: 0;
            white-space: nowrap;
            height: fit-content;
        }

        .profile-avatar {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            background: linear-gradient(135deg, var(--red), #4a0408);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            box-shadow: 0 4px 14px var(--red-glow);
            flex-shrink: 0;
        }

        /* ── Main Container ── */
        .player-wrapper {
            padding-top: 120px;
            padding-bottom: 50px;
            max-width: 1600px;
            margin: 0 auto;
            padding-left: clamp(16px, 2vw, 40px);
            padding-right: clamp(16px, 2vw, 40px);
            contain: layout style paint;
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        /* ── Server Tabs ── */
        .server-section {
            margin-bottom: 24px;
            z-index: 50;
            position: relative;
            width: 100%;
        }

        .server-label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 12px;
            display: block;
        }

        .server-tabs {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            min-height: 40px;
            align-items: center;
            contain: layout style;
            width: 100%;
        }

        .server-btn {
            background: var(--bg-card);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-muted);
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.25s ease;
            font-family: 'Inter', sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
            will-change: background, border-color;
            contain: layout style;
            white-space: nowrap;
            height: fit-content;
        }

        .server-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: translateX(-100%);
            transition: transform 0.5s ease;
        }

        .server-btn:hover {
            background: var(--bg-elevated);
            color: var(--text);
            border-color: rgba(255,255,255,0.2);
        }

        .server-btn.active {
            background: linear-gradient(135deg, var(--red), var(--red-dark));
            border-color: var(--red);
            color: #fff;
            box-shadow: 0 4px 14px var(--red-glow);
        }

        .server-badge {
            font-size: 0.65rem;
            background: rgba(255,255,255,0.2);
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .server-btn.active .server-badge { background: rgba(255,255,255,0.3); }

        /* ── Player Container ── */
        .player-container {
            width: 100%;
            max-width: 100%;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            margin-bottom: 30px;
            border: 1px solid rgba(255,255,255,0.08);
            aspect-ratio: 16 / 9;
            contain: layout style paint;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 400px;
        }

        .player-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            border: none;
            background: #000;
            will-change: auto;
        }

        .player-controls {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 12;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            contain: layout style;
        }

        .now-playing-strip {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            background: linear-gradient(90deg, rgba(229,9,20,0.15), rgba(255,255,255,0.02));
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            padding: 14px 18px;
            margin: 0 0 24px 0;
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
            contain: layout style;
            width: 100%;
            flex-wrap: wrap;
        }

        .now-playing-label {
            font-size: 0.72rem;
            color: var(--text-muted);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            font-weight: 700;
            flex-shrink: 0;
        }

        .now-playing-title {
            font-size: clamp(1rem, 2vw, 1.5rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            color: var(--text);
            text-shadow: 0 0 18px rgba(229,9,20,0.28);
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .now-playing-meta {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 600;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .player-fullscreen-btn {
            appearance: none;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(11, 11, 15, 0.72);
            color: var(--text);
            border-radius: 999px;
            padding: 10px 16px;
            font-weight: 700;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(8px);
            transition: all 0.2s ease;
            will-change: background;
            white-space: nowrap;
            height: fit-content;
        }

        .player-fullscreen-btn:hover {
            background: rgba(229, 9, 20, 0.82);
            border-color: rgba(229, 9, 20, 0.9);
            transform: translateY(-1px);
        }

        .player-container.is-fullscreen {
            border-radius: 0;
            box-shadow: none;
        }

        /* ── Loading State ── */
        .player-loading {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            background: linear-gradient(135deg, #1a1a1f 0%, #2a2a32 100%);
            z-index: 10;
            transition: opacity 0.4s ease;
            contain: layout style paint;
        }

        .player-loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(229, 9, 20, 0.2);
            border-top-color: var(--red);
            border-radius: 50%;
            animation: spin 1.2s linear infinite;
            will-change: transform;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loading-text {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text);
        }

        .loading-subtext {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* ── Details Section ── */
        .details-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 40px;
            align-items: start;
            contain: layout style;
            width: 100%;
        }

        .poster-container {
            position: sticky;
            top: 140px;
            width: 100%;
            max-width: 280px;
        }

        .poster {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.9);
            border: 1px solid rgba(255,255,255,0.1);
            transition: transform 0.3s ease;
            background: var(--bg-card);
            aspect-ratio: 2/3;
            will-change: auto;
            contain: layout style paint;
        }

        .poster img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
            will-change: transform;
        }

        .poster:hover img { transform: scale(1.03); }

        .info {
            display: flex;
            flex-direction: column;
            gap: 16px;
            contain: layout style;
            width: 100%;
        }

        .info-title {
            font-family: 'Inter', sans-serif;
            font-size: clamp(1.8rem, 4vw, 3rem);
            font-weight: 900;
            color: var(--text);
            line-height: 1.2;
            letter-spacing: -1px;
            word-break: break-word;
        }

        .meta-row {
            display: flex;
            gap: 16px;
            align-items: center;
            flex-wrap: wrap;
            color: var(--text-muted);
            font-weight: 500;
            font-size: 0.95rem;
            contain: layout style;
            width: 100%;
        }

        .meta-item { 
            display: flex; 
            align-items: center; 
            gap: 4px;
            flex-shrink: 0;
        }

        .meta-item.match { color: var(--green); font-weight: 700; }

        .maturity-badge {
            border: 1px solid rgba(255,255,255,0.4);
            padding: 3px 10px;
            border-radius: 3px;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .genres-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 8px;
            contain: layout style;
            width: 100%;
        }

        .genre-tag {
            background: var(--bg-card);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 0.8rem;
            color: var(--text);
            transition: all 0.2s ease;
            will-change: border-color, background;
            white-space: nowrap;
        }

        .genre-tag:hover {
            border-color: var(--red);
            background: var(--bg-elevated);
        }

        .overview-text {
            color: var(--text-muted);
            line-height: 1.7;
            font-size: 1rem;
            margin-top: 8px;
        }

        .detail-section {
            margin-top: 28px;
            padding-top: 28px;
            border-top: 1px solid rgba(255,255,255,0.08);
        }

        .detail-section h3 {
            font-size: 1.1rem;
            margin-bottom: 12px;
            color: var(--text);
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .detail-section p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.6;
        }

        /* ── Episode Guide ── */
        .episode-guide {
            margin-top: 28px;
            padding-top: 28px;
            border-top: 1px solid rgba(255,255,255,0.08);
        }

        .episode-guide h3 {
            font-size: 1.1rem;
            margin-bottom: 16px;
            color: var(--text);
            font-weight: 700;
        }

        .season-cards {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 16px;
            scrollbar-width: none;
            contain: layout style;
            width: 100%;
        }

        .season-cards::-webkit-scrollbar { display: none; }

        .season-card {
            background: var(--bg-card);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 0;
            overflow: hidden;
            min-width: 110px;
            cursor: pointer;
            transition: all 0.2s ease;
            will-change: border-color, transform;
            contain: layout style paint;
            flex-shrink: 0;
        }

        .season-card:hover { 
            border-color: var(--red); 
            transform: translateY(-2px); 
        }

        .season-card.active { 
            border-color: var(--red); 
            box-shadow: 0 10px 30px rgba(229,9,20,0.18); 
        }

        .season-poster {
            width: 100%;
            height: 130px;
            object-fit: cover;
            display: block;
            background: rgba(255,255,255,0.05);
        }

        .season-label {
            padding: 10px 8px;
            font-size: 0.76rem;
            font-weight: 700;
            color: var(--text);
            text-align: center;
        }

        .seasons-select {
            background: var(--bg-card);
            border: 1px solid rgba(255,255,255,0.15);
            color: var(--text);
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
            margin-bottom: 16px;
            will-change: border-color;
            width: 100%;
            max-width: 300px;
        }

        .seasons-select:hover { border-color: var(--red); }

        .episodes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
            max-height: 450px;
            overflow-y: auto;
            contain: layout style;
            width: 100%;
        }

        .episode-item {
            background: var(--bg-card);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 0;
            cursor: pointer;
            transition: all 0.2s ease;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            will-change: border-color, background, transform;
            contain: layout style paint;
        }

        .episode-item:hover {
            border-color: var(--red);
            background: var(--bg-elevated);
            transform: translateY(-2px);
            box-shadow: 0 14px 30px rgba(0,0,0,0.2);
        }

        .episode-item.active {
            border-color: var(--red);
            box-shadow: 0 10px 30px rgba(229,9,20,0.18);
        }

        .episode-thumb {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            display: block;
            background: rgba(255,255,255,0.04);
        }

        .episode-content {
            padding: 12px;
            text-align: left;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .episode-num {
            font-weight: 700;
            color: var(--red);
            font-size: 0.9rem;
            margin-bottom: 6px;
        }

        .episode-name {
            color: var(--text);
            font-size: 0.82rem;
            line-height: 1.35;
            min-height: 2.7em;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            flex: 1;
        }

        .episode-meta {
            color: var(--text-muted);
            font-size: 0.72rem;
            margin-top: 8px;
        }

        /* ── Auto-play Indicator ── */
        .autoplay-indicator {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 12px 16px;
            background: rgba(70, 211, 105, 0.15);
            border: 1px solid rgba(70, 211, 105, 0.3);
            border-radius: 6px;
            font-size: 0.85rem;
            color: var(--green);
            font-weight: 600;
            z-index: 5000;
            display: none;
            gap: 8px;
            align-items: center;
            cursor: pointer;
            will-change: auto;
            contain: layout style;
        }

        .autoplay-indicator.active { display: flex; }

        /* ── Toast Notification ── */
        .toast {
            position: fixed;
            bottom: 100px;
            right: 30px;
            background: rgba(24, 24, 28, 0.97);
            color: white;
            padding: 16px 24px;
            border-radius: 8px;
            border-left: 4px solid var(--red);
            z-index: 9999;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 12px 36px rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideIn 0.3s ease;
            will-change: transform;
            contain: layout style;
            max-width: 90vw;
        }

        @keyframes slideIn {
            from { transform: translateX(400px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .toast.error { border-left-color: #ff6b6b; }
        .toast.success { border-left-color: var(--green); }

        /* ── Footer ── */
        footer {
            padding: 30px clamp(16px, 2vw, 40px);
            color: var(--text-dim);
            font-size: 12px;
            border-top: 1px solid rgba(255,255,255,0.08);
            margin-top: 40px;
            text-align: center;
            width: 100%;
        }

        /* ── Responsive ── */
        @media (max-width: 1200px) {
            .details-grid {
                grid-template-columns: 1fr;
                gap: 30px;
            }

            .poster-container {
                position: static;
                max-width: 280px;
                margin: 0 auto;
            }

            .info {
                text-align: left;
            }

            .player-container {
                min-height: 300px;
            }
        }

        @media (max-width: 768px) {
            .player-wrapper { 
                padding-top: 100px;
                padding-bottom: 40px;
            }

            .nav { 
                padding: 12px 16px; 
                gap: 12px;
            }

            .nav.scrolled { 
                padding: 8px 16px; 
            }

            .nav-logo { 
                font-size: 1.4rem; 
            }

            .btn-back { 
                font-size: 0.8rem; 
                padding: 8px 12px; 
            }

            .info-title { 
                font-size: 1.6rem; 
            }

            .server-btn { 
                padding: 8px 16px; 
                font-size: 0.8rem; 
            }

            .server-badge { 
                font-size: 0.55rem; 
            }

            .player-container {
                min-height: 250px;
                margin-bottom: 20px;
            }

            .now-playing-strip {
                margin-bottom: 16px;
                padding: 12px 14px;
            }

            .now-playing-title {
                font-size: clamp(0.9rem, 2vw, 1.2rem);
            }

            .details-grid {
                gap: 20px;
            }

            .episodes-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                max-height: 400px;
            }
        }

        @media (max-width: 480px) {
            .player-wrapper {
                padding-left: 12px;
                padding-right: 12px;
                padding-top: 85px;
            }

            .nav-right { 
                gap: 8px; 
            }

            .btn-back span { 
                display: none; 
            }

            .btn-back {
                padding: 6px 10px;
            }

            .adblock-status { 
                display: none; 
            }

            .server-tabs { 
                gap: 6px; 
            }

            .server-btn { 
                padding: 7px 12px; 
                font-size: 0.75rem; 
            }

            .info-title { 
                font-size: 1.3rem; 
            }

            .meta-row { 
                font-size: 0.8rem; 
                gap: 8px; 
            }

            .genre-tag { 
                padding: 4px 10px; 
                font-size: 0.7rem; 
            }

            .player-container {
                min-height: 200px;
                margin-bottom: 16px;
            }

            .now-playing-strip {
                gap: 10px;
                padding: 10px 12px;
            }

            .now-playing-title {
                font-size: 0.9rem;
            }

            .player-fullscreen-btn {
                padding: 8px 12px;
                font-size: 0.75rem;
            }

            .player-fullscreen-btn span {
                display: none;
            }

            .details-grid {
                gap: 16px;
            }

            .poster-container {
                max-width: 100%;
            }

            .seasons-select {
                max-width: 100%;
            }

            .episodes-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
                gap: 8px;
            }

            .episode-content {
                padding: 10px;
            }

            .episode-num {
                font-size: 0.8rem;
            }

            .episode-name {
                font-size: 0.75rem;
            }

            .episode-meta {
                font-size: 0.65rem;
            }

            .toast {
                bottom: 80px;
                right: 16px;
                left: 16px;
                max-width: calc(100vw - 32px);
                font-size: 13px;
                padding: 12px 16px;
            }

            .autoplay-indicator {
                bottom: 100px;
                right: 16px;
                left: 16px;
                max-width: calc(100vw - 32px);
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="nav" id="mainNav">
        <a href="index.html" class="nav-logo">HR OTT</a>
        <div class="nav-right">
            <a href="index.html" class="btn-back">
                <i class="fas fa-arrow-left"></i>
                <span>Back</span>
            </a>
            <div class="adblock-status">
                <i class="fas fa-shield-alt"></i>
                <span id="adblockText">Ad Block: ON (0)</span>
            </div>
            <div class="profile-avatar">HR</div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="player-wrapper">
        <!-- Server Selection -->
        <div class="server-section">
            <label class="server-label"><i class="fas fa-server"></i> Select Stream Source</label>
            <div class="server-tabs" id="serverTabs">
                <!-- Dynamically populated -->
            </div>
        </div>

        <!-- Video Player Container -->
        <div class="player-container" id="playerContainer">
            <div class="player-controls">
                <button class="player-fullscreen-btn" id="playerFullscreenBtn" type="button" aria-label="Toggle fullscreen">
                    <i class="fas fa-expand"></i>
                    <span>Fullscreen</span>
                </button>
            </div>
            <div class="player-loading" id="playerLoading">
                <div class="spinner"></div>
                <div class="loading-text">Loading Player</div>
                <div class="loading-subtext" id="loadingSubtext">Initializing stream...</div>
            </div>
        </div>

        <div class="now-playing-strip" id="nowPlayingStrip">
            <div class="now-playing-label">Now Playing</div>
            <div class="now-playing-title" id="nowPlayingTitle">Loading...</div>
            <div class="now-playing-meta" id="nowPlayingMeta">Preparing stream...</div>
        </div>

        <!-- Auto-play Indicator -->
        <div class="autoplay-indicator" id="autoplayIndicator">
            <i class="fas fa-play-circle"></i>
            <span>Next episode in <span id="autoplayCounter">10</span>s...</span>
        </div>

        <!-- Movie Details -->
        <div class="details-grid" id="detailsGrid">
            <div class="poster-container">
                <div class="poster">
                    <img id="posterImg" src="" alt="Movie Poster" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 300 450%22%3E%3Crect fill=%22%23222%22 width=%22300%22 height=%22450%22/%3E%3C/svg%3E';">
                </div>
            </div>

            <div class="info">
                <h1 class="info-title" id="titleText">Loading...</h1>
                <div class="meta-row" id="metaRow"></div>
                <div class="genres-row" id="genresRow"></div>
                <p class="overview-text" id="overviewText"></p>

                <div class="detail-section">
                    <h3><i class="fas fa-users"></i> Cast</h3>
                    <p id="castText">Loading cast information...</p>
                </div>

                <div class="detail-section">
                    <h3><i class="fas fa-video"></i> Description</h3>
                    <p id="descText"></p>
                </div>

                <div class="episode-guide" id="episodeGuide" style="display:none;">
                    <h3><i class="fas fa-list"></i> Episodes</h3>
                    <div class="season-cards" id="seasonCards"></div>
                    <select class="seasons-select" id="seasonsSelect">
                        <option>Loading seasons...</option>
                    </select>
                    <div class="episodes-grid" id="episodesGrid">
                        <!-- Dynamically populated -->
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 HR OTT — Stream Movies & Series. Powered by TMDB.</p>
    </footer>

    <script>
        'use strict';

        (function() {
            // ═══════ OPTIMIZED AD BLOCKER ═══════
            class OptimizedAdBlocker {
                constructor() {
                    this.blockedAds = 0;
                    this.adDomains = new Set([
                        'googlesyndication.com', 'googleadservices.com', 'doubleclick.net',
                        'ads.google.com', 'pagead2.googlesyndication.com', 'adservice.google.com',
                        'facebook.com', 'facebook.net', 'criteo.com', 'taboola.com'
                    ]);
                    this.initAdBlocker();
                }

                initAdBlocker() {
                    const originalFetch = window.fetch;
                    const self = this;

                    window.fetch = function(...args) {
                        const url = String(args[0] || '');
                        if (self.isAdURL(url)) {
                            self.blockedAds++;
                            return Promise.reject(new Error('Blocked'));
                        }
                        return originalFetch.apply(this, args);
                    };

                    if (document.readyState === 'loading') {
                        document.addEventListener('DOMContentLoaded', () => this.setupMutationObserver());
                    } else {
                        this.setupMutationObserver();
                    }
                }

                setupMutationObserver() {
                    let debounceTimer;
                    const observer = new MutationObserver(() => {
                        clearTimeout(debounceTimer);
                        debounceTimer = setTimeout(() => this.cleanAds(), 100);
                    });

                    observer.observe(document.body, {
                        childList: true,
                        subtree: true
                    });
                }

                isAdURL(url) {
                    if (!url || url.length > 2048) return false;
                    const lower = url.toLowerCase();
                    for (let domain of this.adDomains) {
                        if (lower.includes(domain)) return true;
                    }
                    return /[?&]ad[=&]/.test(lower);
                }

                cleanAds() {
                    requestAnimationFrame(() => {
                        const ads = document.querySelectorAll('iframe[src*="ad"], [class*="ad-"], [id*="ad-"]');
                        ads.forEach(el => {
                            try {
                                if (!el.closest('#playerContainer')) {
                                    el.remove();
                                    this.blockedAds++;
                                }
                            } catch (e) {}
                        });
                    });
                }

                getStats() {
                    return this.blockedAds;
                }
            }

            const adBlocker = new OptimizedAdBlocker();

            // ═══════ CACHE MANAGER ═══════
            class CacheManager {
                constructor(ttl = 3600000) {
                    this.ttl = ttl;
                }

                set(key, value) {
                    try {
                        localStorage.setItem(`c_${key}`, JSON.stringify({v: value, t: Date.now()}));
                    } catch (e) {}
                }

                get(key) {
                    try {
                        const item = localStorage.getItem(`c_${key}`);
                        if (!item) return null;
                        const {v, t} = JSON.parse(item);
                        return Date.now() - t < this.ttl ? v : null;
                    } catch (e) {
                        return null;
                    }
                }
            }

            const cache = new CacheManager();

            // ═══════ CONSTANTS ═══════
            const TMDB_TOKEN = 'eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiIzYTg3YjFkYjYzYmM3NGI4ZTNmZTkyNjZkZGM3NWIzMCIsIm5iZiI6MTc4Njg2NTkwOS40ODE5OTk5LCJzdWIiOiI2YTgxNjhmNThkMTFjYTkzYTRjOTQwMjUiLCJzY29wZXMiOlsiYXBpX3JlYWQiXSwidmVyc2lvbiI6MX0.01jTorcHrhobfm6YuVtlrxA5AGgM12WD_NbPKLxt76s';
            const TMDB_BASE = 'https://api.themoviedb.org/3';
            const TMDB_IMG = 'https://image.tmdb.org/t/p/w500';

            // ═══════ STATE ═══════
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            const type = (params.get('type') || 'movie').toLowerCase();
            let season = parseInt(params.get('s') || '1');
            let episode = parseInt(params.get('e') || '1');
            let isLoading = false;
            let currentSource = 1;
            let autoplayTimer = null;

            const playerSources = {};

            function refreshPlayerSources() {
                const baseUrl = type === 'tv' 
                    ? `embed/tv/${id}/${season}/${episode}`
                    : `embed/movie/${id}`;

                playerSources[1] = {name: 'NxSha', badge: 'Primary', url: `https://nxsha.space/${baseUrl}`};
                playerSources[2] = {name: 'VidSrc', badge: 'Fast', url: `https://vidsrc.sbs/${baseUrl}`};
                playerSources[3] = {name: 'VidBolt', badge: 'HD', url: `https://vidbolt.pro/${baseUrl}?autoPlay=1`};
            }

            refreshPlayerSources();

            // ═══════ UTILS ═══════
            function showToast(msg, type = 'success') {
                const t = document.createElement('div');
                t.className = `toast ${type}`;
                t.innerHTML = `<i class="fas fa-${type === 'success' ? 'check' : 'x'}-circle"></i>${msg}`;
                document.body.appendChild(t);
                setTimeout(() => t.remove(), 3000);
            }

            function buildIframe(src) {
                const i = document.createElement('iframe');
                i.src = src;
                i.allow = 'autoplay; fullscreen; encrypted-media';
                i.allowFullscreen = true;
                return i;
            }

            // ═══════ PLAYER CONTROL ═══════
            function loadPlayerEmbed(key) {
                if (isLoading) return;
                isLoading = true;

                const source = playerSources[key];
                if (!source) return;

                currentSource = key;
                const oldIframe = document.querySelector('.player-container iframe');
                if (oldIframe) oldIframe.remove();

                const loading = document.getElementById('playerLoading');
                loading.classList.remove('hidden');

                const iframe = buildIframe(source.url);
                const timeout = setTimeout(() => {
                    loading.classList.add('hidden');
                    isLoading = false;
                }, 12000);

                iframe.onload = () => {
                    clearTimeout(timeout);
                    loading.classList.add('hidden');
                    isLoading = false;
                    showToast(`Playing with ${source.name} (${adBlocker.getStats()} ads blocked)`);
                };

                iframe.onerror = () => {
                    clearTimeout(timeout);
                    isLoading = false;
                    showToast(`Failed to load ${source.name}`, 'error');
                    loading.classList.add('hidden');
                };

                document.getElementById('playerContainer').appendChild(iframe);
                document.querySelectorAll('.server-btn').forEach(b => 
                    b.classList.toggle('active', b.dataset.source == key)
                );
            }

            function initServerButtons() {
                const container = document.getElementById('serverTabs');
                if (!container) return;

                container.innerHTML = '';
                Object.entries(playerSources).forEach(([k, s]) => {
                    const b = document.createElement('button');
                    b.className = `server-btn ${k === '1' ? 'active' : ''}`;
                    b.dataset.source = k;
                    b.innerHTML = `${s.name} <span class="server-badge">${s.badge}</span>`;
                    b.onclick = () => loadPlayerEmbed(parseInt(k));
                    container.appendChild(b);
                });
            }

            function updateNowPlaying() {
                const t = document.getElementById('nowPlayingTitle');
                const m = document.getElementById('nowPlayingMeta');
                if (!t || !m) return;

                t.textContent = document.getElementById('titleText')?.textContent || 'Loading...';
                m.textContent = type === 'tv' ? `S${season} E${episode}` : 'Movie';
            }

            // ═══════ EPISODE GUIDE ═══════
            async function loadEpisodeGuide() {
                if (type !== 'tv') return;

                const guide = document.getElementById('episodeGuide');
                if (!guide) return;

                try {
                    let seasons = cache.get(`seasons_${id}`);
                    if (!seasons) {
                        const res = await fetch(`${TMDB_BASE}/tv/${id}`, {
                            headers: {'Authorization': 'Bearer ' + TMDB_TOKEN}
                        });
                        if (!res.ok) return;
                        const data = await res.json();
                        seasons = data.seasons || [];
                        cache.set(`seasons_${id}`, seasons);
                    }

                    if (!seasons.length) return;
                    guide.style.display = 'block';

                    const select = document.getElementById('seasonsSelect');
                    const cards = document.getElementById('seasonCards');
                    select.innerHTML = '';
                    cards.innerHTML = '';

                    seasons.forEach(s => {
                        const opt = document.createElement('option');
                        opt.value = s.season_number;
                        opt.textContent = s.name || `Season ${s.season_number}`;
                        select.appendChild(opt);

                        const card = document.createElement('button');
                        card.type = 'button';
                        card.className = 'season-card' + (s.season_number === season ? ' active' : '');
                        card.dataset.seasonNumber = s.season_number;
                        const p = s.poster_path ? `${TMDB_IMG}${s.poster_path}` : '';
                        card.innerHTML = (p ? `<img class="season-poster" src="${p}" alt="">` : `<div class="season-poster" style="display:flex;align-items:center;justify-content:center;font-weight:800;">S${s.season_number}</div>`) + `<div class="season-label">Season ${s.season_number}</div>`;
                        card.onclick = () => {
                            season = s.season_number;
                            episode = 1;
                            refreshPlayerSources();
                            updateNowPlaying();
                            select.value = season;
                            document.querySelectorAll('.season-card').forEach(c => c.classList.toggle('active', c.dataset.seasonNumber == season));
                            loadSeasonEpisodes(season, id);
                            loadPlayerEmbed(currentSource);
                        };
                        cards.appendChild(card);
                    });

                    select.value = season;
                    select.onchange = (e) => {
                        season = parseInt(e.target.value);
                        episode = 1;
                        refreshPlayerSources();
                        updateNowPlaying();
                        document.querySelectorAll('.season-card').forEach(c => c.classList.toggle('active', c.dataset.seasonNumber == season));
                        loadSeasonEpisodes(season, id);
                        loadPlayerEmbed(currentSource);
                    };

                    loadSeasonEpisodes(season, id);
                } catch (e) {
                    console.error('Episode guide error:', e);
                }
            }

            async function loadSeasonEpisodes(s, tvId) {
                try {
                    let eps = cache.get(`eps_${tvId}_${s}`);
                    if (!eps) {
                        const res = await fetch(`${TMDB_BASE}/tv/${tvId}/season/${s}`, {
                            headers: {'Authorization': 'Bearer ' + TMDB_TOKEN}
                        });
                        if (!res.ok) return;
                        const data = await res.json();
                        eps = data.episodes || [];
                        cache.set(`eps_${tvId}_${s}`, eps);
                    }

                    const grid = document.getElementById('episodesGrid');
                    grid.innerHTML = '';

                    eps.forEach(ep => {
                        const item = document.createElement('button');
                        item.type = 'button';
                        item.className = 'episode-item' + (ep.episode_number === episode && s === season ? ' active' : '');
                        const still = ep.still_path ? `${TMDB_IMG}${ep.still_path}` : '';
                        const thumb = still ? `<img class="episode-thumb" src="${still}" alt="">` : `<div class="episode-thumb" style="display:flex;align-items:center;justify-content:center;font-weight:800;">EP${ep.episode_number}</div>`;
                        item.innerHTML = thumb + `<div class="episode-content"><div class="episode-num">Ep ${ep.episode_number}</div><div class="episode-name">${ep.name || 'Unknown'}</div><div class="episode-meta">${ep.runtime || 'TBA'} min</div></div>`;
                        item.onclick = () => {
                            episode = ep.episode_number;
                            refreshPlayerSources();
                            updateNowPlaying();
                            document.querySelectorAll('.episode-item').forEach(el => el.classList.remove('active'));
                            item.classList.add('active');
                            loadPlayerEmbed(currentSource);
                        };
                        grid.appendChild(item);
                    });
                } catch (e) {
                    console.error('Episodes error:', e);
                }
            }

            // ═══════ FETCH MEDIA ═══════
            async function fetchMediaDetails() {
                try {
                    const endpoint = type === 'movie' ? `/movie/${id}?append_to_response=credits` : `/tv/${id}?append_to_response=credits`;
                    const res = await fetch(TMDB_BASE + endpoint, {
                        headers: {'Authorization': 'Bearer ' + TMDB_TOKEN}
                    });
                    if (!res.ok) throw new Error('Failed');

                    const data = await res.json();

                    const title = data.title || data.name || 'Untitled';
                    const year = (data.release_date || data.first_air_date || '').substring(0, 4);
                    const match = data.vote_average ? Math.round(data.vote_average * 10) : 0;
                    const rating = data.vote_average ? Number(data.vote_average).toFixed(1) : '?';
                    const runtime = data.runtime || (data.episode_run_time?.[0]) || '?';
                    const poster = data.poster_path ? TMDB_IMG + data.poster_path : '';
                    const overview = data.overview || 'No description available.';
                    const genres = data.genres || [];
                    const cast = data.credits?.cast?.slice(0, 8).map(c => c.name).join(', ') || 'N/A';

                    document.title = `${title} - HR OTT`;
                    document.getElementById('titleText').textContent = title;
                    updateNowPlaying();
                    document.getElementById('posterImg').src = poster;
                    document.getElementById('overviewText').textContent = overview;
                    document.getElementById('castText').textContent = cast;
                    document.getElementById('descText').textContent = overview;

                    document.getElementById('metaRow').innerHTML = `
                        <div class="meta-item match">${match}% Match</div>
                        <div class="meta-item">${year}</div>
                        <div class="meta-item"><span class="maturity-badge">${rating}</span></div>
                        <div class="meta-item">${runtime}</div>
                        <div class="meta-item"><i class="fas fa-hd"></i> HD</div>
                    `;

                    document.getElementById('genresRow').innerHTML = genres.map(g => `<div class="genre-tag">${g.name}</div>`).join('') || '<div class="genre-tag">N/A</div>';

                    if (type === 'tv') {
                        await loadEpisodeGuide();
                    }

                    loadPlayerEmbed(1);
                } catch (e) {
                    console.error('Fetch error:', e);
                    showToast('Failed to load media', 'error');
                }
            }

            // ═══════ NAV SCROLL ═══════
            let navTimeout;
            window.addEventListener('scroll', () => {
                clearTimeout(navTimeout);
                navTimeout = setTimeout(() => {
                    const nav = document.getElementById('mainNav');
                    if (nav) nav.classList.toggle('scrolled', window.scrollY > 30);
                }, 50);
            }, { passive: true });

            // ═══════ FULLSCREEN ═══════
            document.getElementById('playerFullscreenBtn')?.addEventListener('click', async () => {
                const container = document.getElementById('playerContainer');
                try {
                    if (!document.fullscreenElement) {
                        await (container.requestFullscreen || container.webkitRequestFullscreen).call(container);
                    } else {
                        await (document.exitFullscreen || document.webkitExitFullscreen).call(document);
                    }
                } catch (e) {}
            });

            // ═══════ AD BLOCK STATS ═══════
            setInterval(() => {
                const el = document.getElementById('adblockText');
                if (el) el.textContent = `Ad Block: ON (${adBlocker.getStats()})`;
            }, 3000);

            // ═══════ INIT ═══════
            if (!id) {
                document.getElementById('titleText').textContent = 'Error: No ID';
                showToast('No media ID provided', 'error');
            } else {
                refreshPlayerSources();
                initServerButtons();
                fetchMediaDetails();
            }

        })();
    </script>
</body>
