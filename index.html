                    </div>
                    <div class="search-results" id="pageSearchResults">
                        <div style="text-align:center;padding:40px;color:var(--text-muted);">Search for movies and TV shows or use filters to browse</div>
                    </div>
                    <div class="load-more-container" id="pageLoadMoreContainer" style="display:none;">
                        <button class="load-more-btn" id="pageLoadMoreBtn"><i class="fas fa-plus"></i> <span>Load More</span></button>
                    </div>`;
                
                container.appendChild(searchSection);
                
                const genreSelect = document.getElementById('searchGenreFilter');
                if (genreSelect && allGenres.length) {
                    allGenres.forEach(g => {
                        const opt = document.createElement('option');
                        opt.value = g.id; 
                        opt.textContent = g.name;
                        genreSelect.appendChild(opt);
                    });
                }
                
                const yearSelect = document.getElementById('searchYearFilter');
                if (yearSelect) {
                    const currentYear = new Date().getFullYear();
                    for (let y = currentYear; y >= 1950; y--) {
                        const opt = document.createElement('option');
                        opt.value = y; 
                        opt.textContent = y;
                        yearSelect.appendChild(opt);
                    }
                }
                
                const langSelect = document.getElementById('searchLanguageFilter');
                if (langSelect && allLanguages.length) {
                    allLanguages.forEach(l => {
                        const opt = document.createElement('option');
                        opt.value = l.iso_639_1; 
                        opt.textContent = l.english_name || l.name;
                        langSelect.appendChild(opt);
                    });
                }
                
                const pageSearchInput = document.getElementById('pageSearchInput');
                const pageSearchBtn = document.getElementById('pageSearchBtn');
                const pageSearchResults = document.getElementById('pageSearchResults');
                const pageLoadMoreContainer = document.getElementById('pageLoadMoreContainer');
                const pageLoadMoreBtn = document.getElementById('pageLoadMoreBtn');
                const clearFiltersBtn = document.getElementById('clearFiltersBtn');
                const searchTypeFilter = document.getElementById('searchTypeFilter');
                const searchGenreFilter = document.getElementById('searchGenreFilter');
                const searchYearFilter = document.getElementById('searchYearFilter');
                const searchLanguageFilter = document.getElementById('searchLanguageFilter');
                const searchSortFilter = document.getElementById('searchSortFilter');
                
                let currentPage = 1, totalPages = 1, isLoading = false;
                
                function buildSearchEndpoint(page = 1) {
                    const query = pageSearchInput.value.trim();
                    const type = searchTypeFilter.value;
                    const genre = searchGenreFilter.value;
                    const year = searchYearFilter.value;
                    const language = searchLanguageFilter.value;
                    const sort = searchSortFilter.value;
                    const hasFilters = genre !== 'all' || year !== 'all' || language !== 'all';
                    
                    if (query.length >= 2) return `/search/multi?query=${encodeURIComponent(query)}&page=${page}`;
                    else if (hasFilters) {
                        let base = type === 'tv' ? '/discover/tv' : '/discover/movie';
                        const params = new URLSearchParams();
                        if (genre !== 'all') params.set('with_genres', genre);
                        if (year !== 'all') params.set('primary_release_year', year);
                        if (language !== 'all') params.set('with_original_language', language);
                        params.set('sort_by', sort); 
                        params.set('page', page); 
                        params.set('vote_count.gte', '10');
                        return `${base}?${params.toString()}`;
                    }
                    return null;
                }
                
                function performSearch(page = 1, append = false) {
                    if (isLoading) return;
                    
                    const endpoint = buildSearchEndpoint(page);
                    if (!endpoint) {
                        pageSearchResults.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-muted);">Type to search or use filters to browse</div>';
                        pageLoadMoreContainer.style.display = 'none';
                        return;
                    }
                    
                    isLoading = true;
                    if (!append) {
                        pageSearchResults.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-muted);"><i class="fas fa-spinner fa-spin"></i> Searching...</div>';
                        currentPage = 1; 
                        pageLoadMoreContainer.style.display = 'none';
                    } else {
                        pageLoadMoreBtn.classList.add('loading');
                        pageLoadMoreBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Loading...';
                    }
                    
                    tmdbFetch(endpoint).then(data => {
                        const items = (data.results || []).filter(m => m.poster_path);
                        totalPages = data.total_pages || 1; 
                        currentPage = page;
                        
                        if (items.length === 0 && !append) {
                            pageSearchResults.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-muted);">No results found</div>';
                            pageLoadMoreContainer.style.display = 'none';
                            return;
                        }
                        
                        if (!append) pageSearchResults.innerHTML = '';
                        
                        const resultsHtml = items.map(item => {
                            const poster = item.poster_path ? TMDB_IMG + item.poster_path : '';
                            const title = getTitle(item);
                            const year = getYear(item);
                            const rating = item.vote_average ? Number(item.vote_average).toFixed(1) : '?';
                            const type = getMediaType(item, searchTypeFilter.value !== 'multi' ? searchTypeFilter.value : null);
                            const typeLabel = type === 'movie' ? 'Movie' : 'TV';
                            
                            return `<a class="search-result-card" href="javascript:void(0)" data-id="${item.id}" data-type="${type}" data-title="${esc(title)}" data-poster="${poster}" data-year="${year}">
                                <img src="${poster}" alt="${esc(title)}" onerror="this.style.background='#222';this.style.opacity='0.5';">
                                <div class="search-result-info">
                                    <div class="search-result-title">${esc(title)}</div>
                                    <div class="search-result-meta">★ ${rating} · ${year} · ${typeLabel}</div>
                                </div>
                            </a>`;
                        }).join('');
                        
                        pageSearchResults.innerHTML += resultsHtml;
                        pageSearchResults.querySelectorAll('.search-result-card').forEach(card => {
                            card.addEventListener('click', (e) => {
                                e.preventDefault();
                                addRecent(card.dataset.id, card.dataset.title, card.dataset.poster, card.dataset.year, card.dataset.type);
                                window.location.href = `/player.html?id=${card.dataset.id}&type=${card.dataset.type}`;
                            });
                        });
                        
                        if (currentPage < totalPages) {
                            pageLoadMoreContainer.style.display = 'block';
                            pageLoadMoreBtn.classList.remove('loading');
                            pageLoadMoreBtn.innerHTML = '<i class="fas fa-plus"></i> <span>Load More</span>';
                            pageLoadMoreBtn.onclick = () => performSearch(currentPage + 1, true);
                        } else {
                            pageLoadMoreContainer.style.display = 'none';
                        }
                    }).catch(err => {
                        console.error('Search error:', err);
                        if (!append) pageSearchResults.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-muted);">Search error</div>';
                        pageLoadMoreContainer.style.display = 'none';
                    }).finally(() => {
                        isLoading = false;
                        pageLoadMoreBtn.classList.remove('loading');
                        pageLoadMoreBtn.innerHTML = '<i class="fas fa-plus"></i> <span>Load More</span>';
                    });
                }
                
                pageSearchInput.addEventListener('input', function() {
                    clearTimeout(appState.searchTimeout);
                    appState.searchTimeout = setTimeout(() => performSearch(1, false), 400);
                });
                
                pageSearchBtn.addEventListener('click', () => performSearch(1, false));
                pageSearchInput.addEventListener('keypress', (e) => { 
                    if (e.key === 'Enter') performSearch(1, false); 
                });
                
                [searchTypeFilter, searchGenreFilter, searchYearFilter, searchLanguageFilter, searchSortFilter].forEach(filter => {
                    filter.addEventListener('change', () => performSearch(1, false));
                });
                
                clearFiltersBtn.addEventListener('click', () => {
                    pageSearchInput.value = '';
                    searchTypeFilter.value = 'multi';
                    searchGenreFilter.value = 'all';
                    searchYearFilter.value = 'all';
                    searchLanguageFilter.value = 'all';
                    searchSortFilter.value = 'popularity.desc';
                    pageSearchResults.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-muted);">Type to search or use filters to browse</div>';
                    pageLoadMoreContainer.style.display = 'none';
                });
                
                showHideFooter(); 
                updateNavActive('search');
            }

            // ═══ 404 ═══
            function render404(path) {
                teardownWall(); 
                hideHero(); 
                appState.currentRoute = '404';
                renderContinueWatching();
                
                const container = document.getElementById('sectionsContainer');
                document.getElementById('mainContent').classList.add('no-hero');
                container.innerHTML = `
                    <div class="not-found-container">
                        <div class="not-found-code">404</div>
                        <h1 class="not-found-title">Page Not Found</h1>
                        <p class="not-found-message">The page "${path}" doesn't exist.</p>
                        <a href="/" class="not-found-btn" onclick="event.preventDefault(); navigateTo('home');"><i class="fas fa-home"></i> Back to Home</a>
                    </div>`;
                showHideFooter(); 
                updateNavActive('');
            }

            // ═══ NAV & ROUTER ═══
            function updateNavActive(route) {
                document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
                document.querySelectorAll('.bottom-nav-item').forEach(a => a.classList.remove('active'));
                const link = document.querySelector(`[data-route="${route}"]`);
                if (link) link.classList.add('active');
            }

            function showHideFooter() {
                const footerWrapper = document.getElementById('footerWrapper');
                const container = document.getElementById('sectionsContainer');
                if (!footerWrapper || !container) return;
                const hasContent = container.children.length > 0 && container.innerHTML.trim() !== '';
                if (hasContent) footerWrapper.classList.remove('hidden');
                else footerWrapper.classList.add('hidden');
            }

            function handleRoute(route) {
                clearTimeout(appState.searchTimeout);
                if(appState.heroTimer) clearInterval(appState.heroTimer);
                
                if (route === 'home') renderHome();
                else if (route === 'movies') renderWall('movies');
                else if (route === 'series') renderWall('tv');
                else if (route === 'new') renderWall('new');
                else if (route === 'my-list') renderMyList();
                else if (route === 'search') renderSearchPage();
                else render404(window.location.pathname);
                
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            function navigateTo(route) {
                const routeMap = { 'home': '/', 'movies': '/movies', 'series': '/series', 'new': '/new', 'my-list': '/my-list', 'search': '/search' };
                window.history.pushState({ route }, '', routeMap[route] || '/');
                handleRoute(route);
            }

            document.querySelectorAll('.nav-links a, .bottom-nav-item').forEach(link => {
                link.addEventListener('click', (e) => { 
                    e.preventDefault(); 
                    navigateTo(link.dataset.route); 
                });
            });

            document.querySelector('.nav-logo').addEventListener('click', (e) => { 
                e.preventDefault(); 
                navigateTo('home'); 
            });
            
            const backBtn = document.getElementById('backToTop');
            window.addEventListener('scroll', () => { 
                backBtn.classList.toggle('visible', window.scrollY > 600); 
            });

            backBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
            
            document.getElementById('watchlistBtnNav').addEventListener('click', () => { 
                navigateTo('my-list'); 
            });

            document.getElementById('clearRecentBtn')?.addEventListener('click', () => { 
                appState.recent = []; 
                saveRec(); 
                renderContinueWatching(); 
                toast('Watch history cleared'); 
            });

            window.addEventListener('popstate', (e) => {
                const route = e.state?.route || getRouteFromPath(window.location.pathname);
                handleRoute(route);
            });

            function getRouteFromPath(path) {
                if (path === '/movies') return 'movies';
                if (path === '/series') return 'series';
                if (path === '/new') return 'new';
                if (path === '/my-list') return 'my-list';
                if (path === '/search') return 'search';
                if (path === '/') return 'home';
                return '404';
            }

            // ═══ CLEANUP ═══
            window.addEventListener('beforeunload', () => {
                appState.activeControllers.forEach(controller => controller.abort());
                
                if(appState.heroTimer) clearInterval(appState.heroTimer);
                clearTimeout(appState.searchTimeout);
                clearTimeout(appState.inactivityTimeout);
                
                if(appState.wallState && appState.wallState.observer) {
                    appState.wallState.observer.disconnect();
                }
                
                appState.starAnimationRunning = false;
                if(appState.rafId) cancelAnimationFrame(appState.rafId);
            });

            // ═══ INIT ═══
            async function init() {
                loadStorage();
                updateWatchlistBadge();
                
                if (appState.watchlist.length > 0) {
                    document.getElementById('watchlistBtnNav').querySelector('i').className = 'fas fa-heart';
                }
                
                await loadConfiguration();
                renderContinueWatching();
                
                const path = window.location.pathname;
                const initialRoute = getRouteFromPath(path);
                appState.currentRoute = initialRoute;
                
                await handleRoute(initialRoute);
                
                setTimeout(() => { 
                    document.getElementById('loadingScreen').classList.add('hidden'); 
                    setTimeout(() => { 
                        const ls = document.getElementById('loadingScreen'); 
                        if (ls) ls.remove(); 
                    }, 600); 
                }, 2600);
                
                refreshHearts();
            }

            init();
        })();
    </script>
</body>
</html>
