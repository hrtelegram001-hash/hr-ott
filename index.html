<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>HR OTT — Watch Movies & Series</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0b0b0f;
            --bg-2: #101015;
            --bg-card: #16161c;
            --bg-elevated: #23232c;
            --red: #E50914;
            --red-dark: #B20710;
            --red-glow: rgba(229,9,20,0.45);
            --gold: #f5c518;
            --text: #ffffff;
            --text-muted: #b3b3b3;
            --text-dim: #7c7c85;
            --green: #46d369;
            --pad: clamp(12px, 3.2vw, 46px);
            --gap: 8px;
            --poster-min: clamp(104px, 14vw, 172px);
            --bottom-nav-height: 65px;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        html { scroll-behavior:smooth; -webkit-tap-highlight-color:transparent; }
        body {
            background:
                radial-gradient(1200px 600px at 80% -10%, rgba(229,9,20,0.10), transparent 60%),
                radial-gradient(900px 500px at 0% 10%, rgba(80,0,120,0.10), transparent 55%),
                var(--bg);
            color: var(--text);
            font-family: 'Inter', system-ui, sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            position: relative;
        }
        #starCanvas { position: fixed; inset:0; z-index:-2; pointer-events:none; opacity:0.28; }
        #cursorGlow {
            position: fixed; width: 460px; height: 460px;
            background: radial-gradient(circle, rgba(229,9,20,0.16) 0%, transparent 70%);
            border-radius: 50%; pointer-events: none; z-index: 9998;
            transform: translate(-50%,-50%); filter: blur(48px);
            will-change: transform; transition: transform 0.05s linear;
        }
        .loading-screen {
            position: fixed; inset:0; background: var(--bg); z-index: 10000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.6s, visibility 0.6s;
        }
        .loading-screen.hidden { opacity:0; visibility:hidden; pointer-events:none; }
        .loading-logo {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(3rem, 13vw, 9rem);
            font-weight: 900; color: var(--red); letter-spacing: 4px;
            opacity: 0; white-space: nowrap;
            animation: netflixIntro 2.5s cubic-bezier(0.165, 0.84, 0.44, 1) forwards;
            text-shadow: 0 0 50px var(--red-glow);
        }
        @keyframes netflixIntro {
            0% { transform: scale(1.5); opacity: 0; filter: blur(15px); letter-spacing: 16px; }
            40% { opacity: 1; filter: blur(2px); letter-spacing: 8px; }
            70% { transform: scale(1); opacity: 1; filter: blur(0); letter-spacing: 4px; }
            100% { opacity: 1; }
        }
        .loading-bar-container { width: 300px; height: 4px; background: rgba(255,255,255,0.1); margin-top: 42px; border-radius: 2px; overflow: hidden; opacity: 0; animation: fadeBarIn 0.5s ease 1s forwards; }
        @keyframes fadeBarIn { to { opacity: 1; } }
        .loading-bar-fill { width: 0%; height: 100%; background: linear-gradient(90deg, var(--red-dark), var(--red)); animation: loadFill 1.5s ease-in-out 1s forwards; }
        @keyframes loadFill { 0% {width:0%;} 100% {width:100%;} }
        .nav {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            padding: 20px var(--pad); display: flex; align-items: center; gap: 28px;
            background: linear-gradient(180deg, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.45) 60%, rgba(0,0,0,0) 100%);
            transition: background 0.3s ease, padding 0.3s ease;
        }
        .nav.scrolled { background: rgba(11,11,15,0.9); padding: 12px var(--pad); backdrop-filter: blur(14px); border-bottom: 1px solid rgba(255,255,255,0.06); }
        .nav-logo { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; font-weight: 900; color: var(--red); letter-spacing: 1px; text-transform: uppercase; cursor: pointer; text-shadow: 0 0 20px var(--red-glow); user-select: none; white-space: nowrap; text-decoration: none; }
        .nav-links { display: flex; gap: 22px; font-size: 14px; font-weight: 500; }
        .nav-links a { color: var(--text-muted); text-decoration: none; transition: color 0.2s; cursor: pointer; }
        .nav-links a:hover, .nav-links a.active { color: var(--text); font-weight: 700; }
        .nav-right { margin-left: auto; display: flex; align-items: center; gap: 18px; }
        
        .search-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(11,11,15,0.98); backdrop-filter: blur(20px);
            z-index: 1000; display: none; flex-direction: column;
            padding: 20px var(--pad); overflow-y: auto;
        }
        .search-overlay.active { display: flex; }
        .search-overlay-header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .search-overlay-input {
            flex: 1; padding: 16px 20px; background: rgba(30,30,36,0.8);
            border: 1px solid rgba(255,255,255,0.2); border-radius: 10px;
            color: #fff; font-size: 18px; outline: none; font-family: 'Inter', sans-serif;
        }
        .search-overlay-input:focus { border-color: var(--red); }
        .search-overlay-close { background: none; border: none; color: #fff; font-size: 2rem; cursor: pointer; padding: 8px; }
        .search-overlay-close:hover { color: var(--red); }
        .search-filters-bar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
        .filter-select {
            background: rgba(30,30,36,0.9); border: 1px solid rgba(255,255,255,0.2);
            color: #fff; padding: 10px 14px; border-radius: 8px; font-size: 0.85rem;
            cursor: pointer; outline: none; font-family: 'Inter', sans-serif; flex: 1; min-width: 120px;
        }
        .filter-select:hover { border-color: var(--red); }
        .search-results { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
        .search-result-card {
            cursor: pointer; border-radius: 8px; overflow: hidden; background: var(--bg-card);
            transition: transform 0.3s, box-shadow 0.3s; text-decoration: none; color: var(--text);
        }
        .search-result-card:hover { transform: scale(1.05); box-shadow: 0 8px 25px rgba(0,0,0,0.8), 0 0 0 2px rgba(229,9,20,0.5); }
        .search-result-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; }
        .search-result-info { padding: 10px; }
        .search-result-title { font-weight: 700; font-size: 0.85rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .search-result-meta { font-size: 0.7rem; color: var(--text-muted); margin-top: 4px; }
        .search-icon-btn { background: transparent; border: none; color: #fff; font-size: 1.3rem; cursor: pointer; padding: 6px; display: flex; align-items: center; }
        .watchlist-btn-nav { background: none; border: none; font-size: 1.3rem; color: #fff; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: color 0.2s; }
        .watchlist-btn-nav:hover { color: var(--red); }
        .profile-avatar { width: 34px; height: 34px; border-radius: 8px; background: linear-gradient(135deg, var(--red), #4a0408); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; cursor: pointer; box-shadow: 0 4px 14px var(--red-glow); }
        .hero { height: 88vh; min-height: 560px; position: relative; overflow: hidden; }
        .hero-slide { position: absolute; inset:0; background-size: cover; background-position: center 20%; opacity: 0; transition: opacity 1.2s ease; will-change: opacity; }
        .hero-slide.active { opacity:1; z-index:2; animation: kenBurns 24s ease-in-out infinite alternate; }
        @keyframes kenBurns { from { transform: scale(1.0); } to { transform: scale(1.12); } }
        .hero-overlay { position: absolute; inset:0; z-index: 3; background: linear-gradient(180deg, rgba(11,11,15,0) 30%, rgba(11,11,15,0.45) 62%, rgba(11,11,15,1) 100%), linear-gradient(90deg, rgba(11,11,15,0.92) 0%, rgba(11,11,15,0.35) 52%, rgba(11,11,15,0) 100%); }
        .hero-content { position: absolute; bottom: 26%; left: var(--pad); z-index: 4; max-width: 620px; }
        .hero-label { font-size: 12px; letter-spacing: 4px; font-weight: 700; color: var(--text-muted); margin-bottom: 14px; display: flex; align-items: center; gap: 12px; }
        .hero-label::before { content: ''; width: 34px; height: 3px; background: var(--red); }
        .hero-title { font-family: 'Inter', sans-serif; font-size: clamp(2.4rem, 6vw, 5.2rem); font-weight: 900; line-height: 0.95; margin-bottom: 16px; text-shadow: 2px 4px 26px rgba(0,0,0,0.9); letter-spacing: -2px; }
        .hero-meta { display: flex; gap: 14px; align-items: center; margin: 0 0 18px; font-size: 14px; flex-wrap: wrap; }
        .hero-meta .match { color: var(--green); font-weight: 700; }
        .maturity-badge { border: 1px solid rgba(255,255,255,0.5); padding: 2px 8px; border-radius: 3px; font-size: 12px; font-weight: 600; }
        .hero-buttons { display: flex; gap: 12px; flex-wrap: wrap; }
        .hero-watch, .hero-info, .hero-watchlist-btn { display: flex; align-items: center; gap: 10px; padding: 13px 30px; border: none; border-radius: 6px; font-size: 17px; font-weight: 700; cursor: pointer; transition: all 0.2s ease; font-family: inherit; text-decoration: none; }
        .hero-watch { background: white; color: black; }
        .hero-watch:hover { background: rgba(255,255,255,0.78); transform: translateY(-1px); }
        .hero-info { background: rgba(60,60,68,0.7); color: white; backdrop-filter: blur(4px); }
        .hero-info:hover { background: rgba(60,60,68,0.5); }
        .hero-watchlist-btn { background: rgba(229,9,20,0.2); color: white; border: 1px solid var(--red); }
        .hero-watchlist-btn:hover { background: rgba(229,9,20,0.4); }
        .hero-watchlist-btn.active { background: var(--red); }
        .hero-dots { position: absolute; bottom: 26%; right: var(--pad); z-index: 4; display: flex; gap: 6px; }
        .hero-dot { width: 30px; height: 3px; background: rgba(255,255,255,0.3); cursor: pointer; transition: background 0.3s; border-radius: 2px; }
        .hero-dot.active { background: var(--red); }
        
        .main-content { position: relative; z-index: 5; margin-top: -70px; padding-bottom: 30px; }
        .continue-watching-section { margin: 0 0 30px; padding: 20px 0; display: none; }
        .continue-watching-section.visible { display: block; }
        .section-header { display: flex; align-items: center; justify-content: space-between; padding: 0 var(--pad); margin-bottom: 15px; }
        .section-title { font-size: 1.3rem; font-weight: 800; color: var(--text); display: flex; align-items: center; gap: 12px; letter-spacing: -0.3px; }
        .section-title::before { content:''; width:4px; height:22px; border-radius:2px; background: var(--red); box-shadow: 0 0 12px var(--red-glow); }
        .section-action { color: var(--text-muted); font-size: 0.85rem; cursor: pointer; transition: color 0.2s; border: none; background: none; font-family: 'Inter', sans-serif; font-weight: 600; }
        .section-action:hover { color: var(--red); }
        .section { margin: 0 0 26px; position: relative; }
        .row-scroll-area { position: relative; }
        .row-track { display: flex; gap: var(--gap); padding: 8px var(--pad) 14px; overflow-x: auto; overflow-y: hidden; scroll-behavior: smooth; scrollbar-width: none; -ms-overflow-style: none; }
        .row-track::-webkit-scrollbar { display: none; }
        .scroll-btn { position: absolute; top: 0; bottom: 0; width: 56px; background: linear-gradient(90deg, rgba(11,11,15,0.95), transparent); border: none; color: white; font-size: 2.4rem; cursor: pointer; z-index: 30; opacity: 0; transition: opacity 0.3s, color 0.2s; display: flex; align-items: center; justify-content: center; }
        .scroll-btn.right { right: 0; background: linear-gradient(-90deg, rgba(11,11,15,0.95), transparent); }
        .scroll-btn.left { left: 0; }
        .section:hover .scroll-btn, .continue-watching-section:hover .scroll-btn { opacity: 1; }
        .scroll-btn:hover { color: var(--red); }
        .grid-wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--poster-min), 1fr)); gap: var(--gap); padding: 8px var(--pad) 20px; }
        .card { flex: 0 0 auto; width: var(--poster-min); position: relative; cursor: pointer; border-radius: 8px; overflow: hidden; background: var(--bg-card); transition: transform 0.35s cubic-bezier(0.5,0,0.1,1), box-shadow 0.35s; box-shadow: 0 4px 14px rgba(0,0,0,0.5); text-decoration: none; color: var(--text); display: block; }
        .grid-wall .card { width: 100%; }
        .card-thumb { position: relative; width: 100%; aspect-ratio: 2/3; background: #14141a; overflow: hidden; }
        .card-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.5s ease; }
        .card:hover { transform: scale(1.07) translateY(-4px); z-index: 60; box-shadow: 0 24px 50px rgba(0,0,0,0.85), 0 0 0 2px rgba(229,9,20,0.55); }
        .card:hover .card-thumb img { transform: scale(1.06); }
        .card-rating { position: absolute; top: 8px; left: 8px; z-index: 4; display: flex; align-items: center; gap: 4px; background: rgba(0,0,0,0.72); backdrop-filter: blur(4px); padding: 3px 7px; border-radius: 5px; font-size: 0.72rem; font-weight: 700; }
        .card-rating i { color: var(--gold); font-size: 0.7rem; }
        .card-toplist { position: absolute; top: 8px; right: 8px; z-index: 4; background: var(--red); color: #fff; font-size: 0.62rem; font-weight: 800; letter-spacing: 0.5px; padding: 3px 6px; border-radius: 5px; text-transform: uppercase; }
        .card-overlay { position: absolute; inset: 0; z-index: 3; background: linear-gradient(180deg, transparent 35%, rgba(0,0,0,0.55) 65%, rgba(0,0,0,0.96) 100%); opacity: 0; display: flex; flex-direction: column; justify-content: flex-end; padding: 12px 12px 14px; transition: opacity 0.28s ease; }
        .card:hover .card-overlay { opacity: 1; }
        .card-name { font-weight: 700; font-size: 0.86rem; line-height: 1.2; margin-bottom: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .card-sub { font-size: 0.72rem; color: var(--text-muted); margin-bottom: 10px; display: flex; gap: 8px; align-items:center; }
        .card-sub .match { color: var(--green); font-weight: 700; }
        .card-buttons { display: flex; gap: 6px; }
        .circle-btn { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.55); background: rgba(30,30,36,0.7); color: white; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 12px; transition: all 0.2s; }
        .circle-btn:hover { border-color: white; background: rgba(80,80,90,0.9); transform: scale(1.08); }
        .circle-btn.play-btn { background: white; color: black; border-color: white; }
        .circle-btn.play-btn:hover { background: rgba(255,255,255,0.82); }
        .card-heart.fas { color: var(--red); animation: heartPop 0.35s ease; }
        @keyframes heartPop { 0%{transform:scale(1);} 50%{transform:scale(1.4);} 100%{transform:scale(1);} }
        .grid-sentinel { height: 1px; width: 100%; }
        .grid-loader { text-align:center; padding: 24px; color: var(--text-dim); font-size: 0.9rem; }
        .grid-loader i { color: var(--red); }
        .progress-bar { position: absolute; bottom: 0; left: 0; height: 3px; background: var(--red); z-index: 5; border-radius: 0 2px 2px 0; }
        .back-to-top { position: fixed; bottom: 80px; right: 30px; width: 50px; height: 50px; border-radius: 50%; background: var(--red); display: none; align-items: center; justify-content: center; color: #fff; font-size: 1.2rem; cursor: pointer; z-index: 90; box-shadow: 0 4px 25px var(--red-glow); transition: all 0.3s; border: none; }
        .back-to-top.visible { display:flex; }
        .back-to-top:hover { transform: translateY(-4px); background: var(--red-dark); }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 1000; display: flex; align-items: flex-start; justify-content: center; padding: 5vh 20px; overflow-y: auto; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content { background: var(--bg-2); border-radius: 12px; max-width: 900px; width: 100%; position: relative; box-shadow: 0 30px 80px rgba(0,0,0,0.9); transform: scale(0.92) translateY(20px); transition: transform 0.4s cubic-bezier(0.5,0,0.1,1); overflow: hidden; }
        .modal-overlay.active .modal-content { transform: scale(1) translateY(0); }
        .modal-close { position: absolute; top: 18px; right: 18px; width: 40px; height: 40px; border-radius: 50%; background: rgba(20,20,24,0.85); border: none; color: white; font-size: 1.2rem; cursor: pointer; z-index: 10; display: flex; align-items: center; justify-content: center; transition: background 0.2s, transform 0.2s; }
        .modal-close:hover { background: rgba(60,60,60,0.95); transform: rotate(90deg); }
        .modal-hero { position: relative; height: 50vh; min-height: 340px; }
        .modal-hero img { width: 100%; height: 100%; object-fit: cover; }
        .modal-hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 30%, var(--bg-2) 100%), linear-gradient(90deg, rgba(16,16,21,0.85) 0%, transparent 60%); }
        .modal-hero-content { position: absolute; bottom: 28px; left: var(--pad); right: var(--pad); z-index: 5; }
        .modal-title { font-size: 2.4rem; font-weight: 900; margin: 0 0 16px; text-shadow: 2px 2px 12px rgba(0,0,0,0.9); letter-spacing: -1px; }
        .modal-play-btn, .modal-watchlist-btn { display: inline-flex; align-items: center; gap: 10px; padding: 12px 28px; background: white; color: black; border: none; border-radius: 6px; font-size: 1.1rem; font-weight: 800; cursor: pointer; transition: background 0.2s; margin-right: 10px; text-decoration: none; }
        .modal-play-btn:hover { background: rgba(255,255,255,0.78); }
        .modal-watchlist-btn { background: rgba(229,9,20,0.2); color: white; border: 1px solid var(--red); }
        .modal-watchlist-btn:hover { background: rgba(229,9,20,0.4); }
        .modal-body { padding: 22px var(--pad) 40px; display: grid; grid-template-columns: 1.5fr 1fr; gap: 30px; }
        .modal-body p { font-size: 1rem; line-height: 1.55; color: #fff; margin-bottom: 16px; }
        .modal-body span.label { color: var(--text-dim); display: block; font-size: 0.85rem; margin-bottom: 4px; }
        .modal-body span.value { color: #fff; font-size: 0.95rem; }
        .modal-meta { display: flex; gap: 14px; align-items: center; font-size: 0.9rem; margin-bottom: 16px; flex-wrap: wrap; }
        .empty-state { text-align: center; padding: 110px 20px; color: #888; }
        .empty-state i { font-size: 3rem; margin-bottom: 20px; display: block; color: var(--red); }
        .empty-state h2 { font-size: 1.5rem; margin-bottom: 10px; color:#fff; }
        footer { padding: 30px var(--pad); color: var(--text-dim); font-size: 13px; border-top: 1px solid rgba(255,255,255,0.08); margin-top: 20px; position: relative; z-index: 5; text-align: center; }
        .developer-credits { margin-top: 15px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.05); font-family: 'Inter', sans-serif; }
        .dev-line { font-size: 0.95rem; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
        .dev-line span { color: #fff; font-weight: 700; }
        .taught-line { font-size: 0.85rem; color: var(--text-dim); font-style: italic; }
        .taught-line span { color: var(--red); font-weight: 600; }
        .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(120px); background: rgba(24,24,28,0.97); color: white; padding: 14px 22px; border-radius: 8px; border-left: 4px solid var(--red); z-index: 9999; font-size: 14px; font-weight: 500; box-shadow: 0 12px 36px rgba(0,0,0,0.7); display: flex; align-items: center; gap: 10px; transition: transform 0.4s cubic-bezier(0.5,0,0.1,1); }
        .toast.show { transform: translateX(-50%) translateY(0); }
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #2a2a30; border-radius: 5px; }
        ::-webkit-scrollbar-thumb:hover { background: #444; }
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; height: var(--bottom-nav-height);
            background: rgba(11,11,15,0.98); backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255,255,255,0.1); display: none; z-index: 500;
            align-items: center; justify-content: space-around; padding: 0 10px;
            box-shadow: 0 -5px 30px rgba(0,0,0,0.5);
        }
        .bottom-nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            color: var(--text-muted); text-decoration: none; font-size: 0.7rem;
            font-weight: 600; cursor: pointer; transition: color 0.2s; padding: 8px 15px;
            border: none; background: none; font-family: 'Inter', sans-serif;
        }
        .bottom-nav-item i { font-size: 1.3rem; }
        .bottom-nav-item.active { color: var(--red); }
        .bottom-nav-item:hover { color: var(--text); }
        @media (max-width: 900px) {
            .nav-links { display: none; }
            .hero { height: 78vh; }
            .hero-content { bottom: 22%; }
            .hero-title { font-size: 2.4rem; }
            .hero-watch, .hero-info, .hero-watchlist-btn { padding: 10px 18px; font-size: 14px; }
            .hero-dots { bottom: 22%; }
            .section-title { font-size: 1.1rem; }
            .modal-body { grid-template-columns: 1fr; padding: 20px; }
            .modal-title { font-size: 1.7rem; }
            .bottom-nav { display: flex; }
            .back-to-top { bottom: 80px; }
            .toast { bottom: 80px; }
            body { padding-bottom: var(--bottom-nav-height); }
        }
    </style>
</head>
<body>
    <canvas id="starCanvas"></canvas>
    <div id="cursorGlow"></div>
    <div class="loading-screen" id="loadingScreen">
        <div class="loading-logo">HR&nbsp;OTT</div>
        <div class="loading-bar-container"><div class="loading-bar-fill"></div></div>
    </div>

    <script>
        (function() {
            // ═══════ AD BLOCKER ═══════
            class AdBlocker { constructor() { this.blocked = 0; this.domains = ['googlesyndication.com','doubleclick.net','adservice.google.com','ads-twitter.com','facebook.com/ads','rubiconproject.com','pubmatic.com','openx.net','spotxchange.com','adroll.com','criteo.com','casalemedia.com','amazon-adsystem.com','taboola.com','outbrain.com','exoclick.com','adnxs.com']; this.init(); } init() { const origFetch = window.fetch; const self = this; window.fetch = function(...args) { const url = String(args[0] || ''); if (self.isAd(url)) { self.blocked++; return Promise.reject(new Error('Ad blocked')); } return origFetch.apply(this, args); }; } isAd(url) { if (!url) return false; const low = url.toLowerCase(); for (const d of this.domains) if (low.includes(d)) return true; return /[?&]ad[=&]/.test(low); } getStats() { return this.blocked; } }
            const adBlocker = new AdBlocker();

            // ═══════ CANVAS STARFIELD ═══════
            const canvas = document.getElementById('starCanvas');
            const ctx = canvas.getContext('2d');
            let stars = [];
            function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            function createStars(n) { stars = []; for(let i=0;i<n;i++) stars.push({ x:Math.random()*canvas.width, y:Math.random()*canvas.height, r:Math.random()*1.5+0.5, a:Math.random(), da:(Math.random()*0.04+0.008), s:Math.random()*0.06+0.02 }); }
            createStars(150);
            function drawStars() { ctx.clearRect(0,0,canvas.width,canvas.height); stars.forEach(s => { ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fillStyle = `rgba(255,250,255,${s.a * 0.5})`; ctx.fill(); s.a += s.da; if(s.a<=0.1 || s.a>=0.9) s.da*=-1; s.y += s.s; if(s.y>canvas.height){ s.y=0; s.x=Math.random()*canvas.width; } }); requestAnimationFrame(drawStars); }
            drawStars();

            // ═══════ CURSOR GLOW ═══════
            const cursorGlow = document.getElementById('cursorGlow');
            let rafId=null, mx=0, my=0;
            document.addEventListener('mousemove', e => { mx=e.clientX; my=e.clientY; if(!rafId) rafId = requestAnimationFrame(()=>{ cursorGlow.style.transform = `translate(${mx}px, ${my}px)`; rafId=null; }); });

            // ═══════ CONFIG & API ═══════
            const TMDB_KEY = '3a87b1db63bc74b8e3fe9266ddc75b30';
            const TMDB_BASE = 'https://api.themoviedb.org/3';
            const TMDB_IMG = 'https://image.tmdb.org/t/p/w500';
            const TMDB_BACK = 'https://image.tmdb.org/t/p/original';

            // FIXED: Correct trending endpoint with time_window
            const HOME_ROWS = [
                { key:'trending',   title:'Trending Now',         ep:'/trending/all/week?page=', type:'mixed', hero:true },
                { key:'toprated',   title:'Top Rated Movies',     ep:'/movie/top_rated?page=', type:'movie' },
                { key:'popular',    title:'Popular Movies',       ep:'/movie/popular?page=', type:'movie' },
                { key:'action',     title:'Action & Adventure',   ep:'/discover/movie?with_genres=28&sort_by=popularity.desc&page=', type:'movie' },
                { key:'scifi',      title:'Sci-Fi & Fantasy',     ep:'/discover/movie?with_genres=878&sort_by=popularity.desc&page=', type:'movie' },
                { key:'horror',     title:'Horror & Thrillers',   ep:'/discover/movie?with_genres=27&sort_by=popularity.desc&page=', type:'movie' },
                { key:'comedy',     title:'Comedy',               ep:'/discover/movie?with_genres=35&sort_by=popularity.desc&page=', type:'movie' },
                { key:'animation',  title:'Animation',            ep:'/discover/movie?with_genres=16&sort_by=popularity.desc&page=', type:'movie' },
                { key:'romance',    title:'Romance',              ep:'/discover/movie?with_genres=10749&sort_by=popularity.desc&page=', type:'movie' },
                { key:'bollywood',  title:'Bollywood',            ep:'/discover/movie?with_original_language=hi&sort_by=popularity.desc&page=', type:'movie' },
                { key:'tvshows',    title:'Trending TV Shows',    ep:'/trending/tv/week?page=', type:'tv' },
            ];
            const WALLS = {
                movies: { title:'Movies', ep:'/discover/movie?sort_by=popularity.desc&vote_count.gte=50&page=', type:'movie' },
                tv:     { title:'TV Shows', ep:'/discover/tv?sort_by=popularity.desc&vote_count.gte=50&page=', type:'tv' },
                new:    { title:'New & Popular', ep:'/trending/all/week?page=', type:'mixed' },
            };

            let watchlist=[], recent=[], heroMovies=[], heroIdx=0, heroTimer;
            let wallState = null;
            let currentRoute = 'home';
            let allGenres = [];
            let allLanguages = [];
            let allCountries = [];

            function loadStorage() { try { watchlist=JSON.parse(localStorage.HR_wl||'[]'); recent=JSON.parse(localStorage.HR_rec||'[]'); } catch(e){ watchlist=[]; recent=[]; } }
            function saveWl(){ localStorage.HR_wl = JSON.stringify(watchlist); }
            function saveRec(){ localStorage.HR_rec = JSON.stringify(recent); }

            async function tmdbFetch(endpoint) {
                const sep = endpoint.includes('?') ? '&' : '?';
                const url = `${TMDB_BASE}${endpoint}${sep}api_key=${TMDB_KEY}`;
                try {
                    const res = await fetch(url);
                    if (!res.ok) return { results: [], genres: [], total_pages: 0 };
                    return await res.json();
                } catch (e) { return { results: [], genres: [], total_pages: 0 }; }
            }
            function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
            function toast(msg){ const t=document.createElement('div'); t.className='toast show'; t.innerHTML=`<i class="fas fa-check-circle" style="color:#46d369"></i> ${msg}`; document.body.appendChild(t); setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>t.remove(), 400); },2200); }

            // ═══════ TITLE MAPPING ═══════
            function getTitle(item) { return item.title || item.name || 'Untitled'; }
            function getYear(item) { return (item.release_date || item.first_air_date || '').substring(0,4); }
            function getMediaType(item, forcedType) { return forcedType || item.media_type || 'movie'; }

            // ═══════ LOAD CONFIGURATION DATA ═══════
            async function loadConfiguration() {
                try {
                    // Load genres
                    const movieGenres = await tmdbFetch('/genre/movie/list');
                    const tvGenres = await tmdbFetch('/genre/tv/list');
                    const combined = [...(movieGenres.genres||[]), ...(tvGenres.genres||[])];
                    allGenres = combined.filter((v,i,a)=>a.findIndex(t=>t.id===v.id)===i);
                    
                    // Load languages
                    const langData = await tmdbFetch('/configuration/languages');
                    allLanguages = langData || [];
                    
                    // Load countries
                    const countryData = await tmdbFetch('/configuration/countries');
                    allCountries = countryData || [];
                    
                    populateSearchFilters();
                } catch(e) {
                    allGenres = [];
                    allLanguages = [];
                    allCountries = [];
                }
            }

            function populateSearchFilters() {
                // Genres
                const genreSelect = document.getElementById('searchGenreFilter');
                if (genreSelect && allGenres.length) {
                    genreSelect.innerHTML = '<option value="all">All Genres</option>';
                    allGenres.forEach(g => {
                        const opt = document.createElement('option');
                        opt.value = g.id;
                        opt.textContent = g.name;
                        genreSelect.appendChild(opt);
                    });
                }
                
                // Languages
                const langSelect = document.getElementById('searchLanguageFilter');
                if (langSelect && allLanguages.length) {
                    langSelect.innerHTML = '<option value="all">All Languages</option>';
                    allLanguages.forEach(l => {
                        const opt = document.createElement('option');
                        opt.value = l.iso_639_1;
                        opt.textContent = l.english_name || l.name;
                        langSelect.appendChild(opt);
                    });
                }
                
                // Countries
                const countrySelect = document.getElementById('searchCountryFilter');
                if (countrySelect && allCountries.length) {
                    countrySelect.innerHTML = '<option value="all">All Countries</option>';
                    allCountries.forEach(c => {
                        const opt = document.createElement('option');
                        opt.value = c.iso_3166_1;
                        opt.textContent = c.english_name || c.native_name;
                        countrySelect.appendChild(opt);
                    });
                }
                
                // Years
                const yearSelect = document.getElementById('searchYearFilter');
                if (yearSelect) {
                    yearSelect.innerHTML = '<option value="all">All Years</option>';
                    const currentYear = new Date().getFullYear();
                    for (let y = currentYear; y >= 1950; y--) {
                        const opt = document.createElement('option');
                        opt.value = y;
                        opt.textContent = y;
                        yearSelect.appendChild(opt);
                    }
                }
            }

            // ═══════ CREATE CARD ═══════
            function createCard(item, forcedType, progress){
                const type = getMediaType(item, forcedType);
                if(type !== 'movie' && type !== 'tv') return null;
                const posterPath = item.poster_path ? TMDB_IMG + item.poster_path : (item.backdrop_path ? TMDB_IMG + item.backdrop_path : '');
                const title = getTitle(item);
                const year = getYear(item);
                const rating = item.vote_average?Number(item.vote_average).toFixed(1):'?';
                const match = item.vote_average ? Math.round(item.vote_average * 10) : 0;
                const id = item.id;
                const top = item.vote_average >= 8;
                const detailPath = type === 'movie' ? `/movie/${id}` : `/series/${id}`;
                const playerPath = `/player/${id}/${type}`;
                
                const card = document.createElement('a');
                card.className='card'; 
                card.href = detailPath;
                card.dataset.id = id; 
                card.dataset.type = type;
                
                card.innerHTML = `
                    <div class="card-thumb">
                        <img src="${posterPath}" loading="lazy" alt="${esc(title)}" onerror="this.style.background='#1a1a20';this.style.opacity='0';">
                        <div class="card-rating"><i class="fas fa-star"></i>${rating}</div>
                        ${top?'<div class="card-toplist">Top</div>':''}
                        ${progress ? `<div class="progress-bar" style="width:${progress}%"></div>` : ''}
                        <div class="card-overlay">
                            <div class="card-name">${esc(title)}</div>
                            <div class="card-sub"><span class="match">${match}% Match</span><span>${year||''}</span><span>${type === 'movie' ? 'Movie' : 'TV'}</span></div>
                            <div class="card-buttons">
                                <a class="circle-btn play-btn" href="${playerPath}" title="Play" onclick="event.stopPropagation();"><i class="fas fa-play"></i></a>
                                <button class="circle-btn card-heart" title="My List" onclick="event.preventDefault(); event.stopPropagation();"><i class="far fa-heart"></i></button>
                                <button class="circle-btn info-btn" title="More Info" onclick="event.preventDefault(); event.stopPropagation();"><i class="fas fa-chevron-down"></i></button>
                            </div>
                        </div>
                    </div>`;
                
                card.addEventListener('click', (e) => {
                    e.preventDefault();
                    openMovieModal(id, type);
                });
                
                card.querySelector('.play-btn').addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    addRecent(id, title, posterPath, year, type);
                    window.location.href = playerPath;
                });
                
                card.querySelector('.info-btn').addEventListener('click', (e) => { 
                    e.preventDefault();
                    e.stopPropagation(); 
                    openMovieModal(id, type); 
                });
                
                card.querySelector('.card-heart').addEventListener('click', (e) => { 
                    e.preventDefault();
                    e.stopPropagation(); 
                    toggleWl(id, title, posterPath, year, type); 
                    updateHeart(card, id); 
                });
                
                updateHeart(card, id);
                return card;
            }

            function updateHeart(card, id){ const i = card.querySelector('.card-heart i'); if (i) i.className = watchlist.some(w=>w.id==id) ? 'fas fa-heart' : 'far fa-heart'; }
            function refreshHearts(){ document.querySelectorAll('.card').forEach(c=>updateHeart(c,c.dataset.id)); }
            function toggleWl(id,title,poster,year,type){
                const idx=watchlist.findIndex(w=>w.id==id);
                if(idx>=0){ watchlist.splice(idx,1); toast('Removed from My List'); }
                else { watchlist.push({id:id,title,poster,year,type}); toast('Added to My List'); }
                saveWl();
                const navIcon = document.getElementById('watchlistBtnNav').querySelector('i');
                if (navIcon) navIcon.className = watchlist.length > 0 ? 'fas fa-heart' : 'fas fa-bell';
                refreshHearts();
                if (currentRoute === 'my-list') renderMyList();
            }

            function addRecent(id,title,poster,year,type){
                recent=recent.filter(r=>r.id!=id);
                recent.unshift({id,title,poster,year,type, progress: Math.floor(Math.random()*80)+10});
                if(recent.length>12) recent.pop();
                saveRec(); renderContinueWatching();
            }

            function renderContinueWatching(){
                const section = document.getElementById('continueWatchingSection');
                const grid = document.getElementById('recentGrid');
                if (!section || !grid) return;
                if (recent.length === 0 || currentRoute !== 'home') {
                    section.classList.remove('visible');
                    return;
                }
                section.classList.add('visible');
                grid.innerHTML = '';
                recent.slice(0, 10).forEach(r => {
                    const c = createCard({ id: r.id, title: r.title, poster_path: null, backdrop_path: null, release_date: (r.year || '') + '-01-01', vote_average: 0 }, r.type, r.progress);
                    if (!c) return;
                    const img = c.querySelector('img');
                    if (r.poster) img.src = r.poster;
                    c.querySelector('.card-rating').innerHTML = '<i class="fas fa-clock"></i>';
                    grid.appendChild(c);
                });
                const leftBtn = section.querySelector('.scroll-btn.left');
                const rightBtn = section.querySelector('.scroll-btn.right');
                if (leftBtn) leftBtn.onclick = () => grid.scrollBy({ left: -grid.clientWidth * 0.8, behavior: 'smooth' });
                if (rightBtn) rightBtn.onclick = () => grid.scrollBy({ left: grid.clientWidth * 0.8, behavior: 'smooth' });
            }

            // ═══════ MODAL with external_ids ═══════
            const modal = document.getElementById('movieModal');
            const modalClose = document.getElementById('modalClose');
            const modalPlayBtn = document.getElementById('modalPlayBtn');
            const modalWatchlistBtn = document.getElementById('modalWatchlistBtn');
            let currentModalId = null, currentModalType = 'movie', currentModalTitle = '', currentModalPoster = '', currentModalYear = '';

            async function openMovieModal(id, type) {
                modal.classList.add('active');
                document.body.style.overflow = 'hidden';
                currentModalId = id; currentModalType = type;
                document.getElementById('modalBackdrop').src = '';
                document.getElementById('modalTitle').textContent = 'Loading...';
                document.getElementById('modalDesc').textContent = '';
                document.getElementById('modalMeta').innerHTML = '';
                document.getElementById('modalCast').textContent = '-';
                document.getElementById('modalGenres').textContent = '-';
                document.getElementById('modalType').textContent = type === 'movie' ? 'Movie' : 'TV Show';
                updateModalWatchlistBtn();
                try {
                    const endpoint = type === 'movie' 
                        ? `/movie/${id}?append_to_response=credits,similar,videos,recommendations,external_ids` 
                        : `/tv/${id}?append_to_response=credits,similar,videos,recommendations,external_ids`;
                    const data = await tmdbFetch(endpoint);
                    if (!data || !data.id) { document.getElementById('modalTitle').textContent = 'Not Found'; return; }
                    currentModalTitle = getTitle(data);
                    currentModalYear = getYear(data);
                    currentModalPoster = data.poster_path ? TMDB_IMG + data.poster_path : '';
                    const rating = data.vote_average ? Number(data.vote_average).toFixed(1) : '?';
                    const match = data.vote_average ? Math.round(data.vote_average * 10) : 0;
                    const runtime = data.runtime || (data.episode_run_time && data.episode_run_time[0]) || '?';
                    const backdrop = data.backdrop_path ? TMDB_BACK + data.backdrop_path : (data.poster_path ? TMDB_IMG + data.poster_path : '');
                    const cast = data.credits && data.credits.cast ? data.credits.cast.slice(0, 5).map(c => c.name).join(', ') : 'N/A';
                    const genres = data.genres ? data.genres.map(g => g.name).join(', ') : 'N/A';
                    document.getElementById('modalBackdrop').src = backdrop;
                    document.getElementById('modalTitle').textContent = currentModalTitle;
                    document.getElementById('modalDesc').textContent = data.overview || 'No description available.';
                    document.getElementById('modalMeta').innerHTML = `<span class="match" style="color: var(--green); font-weight: 700;">${match}% Match</span><span>${currentModalYear}</span><span class="maturity-badge">${rating}</span><span>${runtime} min</span>`;
                    document.getElementById('modalCast').textContent = cast;
                    document.getElementById('modalGenres').textContent = genres;
                    modalPlayBtn.href = `/player/${id}/${type}`;
                    updateModalWatchlistBtn();
                } catch (error) { document.getElementById('modalTitle').textContent = 'Error loading details'; }
            }
            function updateModalWatchlistBtn() {
                if (watchlist.some(w=>w.id==currentModalId)) {
                    modalWatchlistBtn.innerHTML = '<i class="fas fa-check"></i> In Watchlist';
                    modalWatchlistBtn.style.background = 'var(--red)';
                } else {
                    modalWatchlistBtn.innerHTML = '<i class="fas fa-plus"></i> Watchlist';
                    modalWatchlistBtn.style.background = 'rgba(229,9,20,0.2)';
                }
            }
            modalPlayBtn.addEventListener('click', (e) => {
                e.preventDefault();
                addRecent(currentModalId, currentModalTitle, currentModalPoster, currentModalYear, currentModalType);
                window.location.href = `/player/${currentModalId}/${currentModalType}`;
            });
            modalWatchlistBtn.addEventListener('click', () => {
                if (watchlist.some(w=>w.id==currentModalId)) { watchlist = watchlist.filter(w=>w.id!=currentModalId); toast('Removed from My List'); }
                else { watchlist.push({id:currentModalId, title:currentModalTitle, poster:currentModalPoster, year:currentModalYear, type:currentModalType}); toast('Added to My List'); }
                saveWl(); refreshHearts(); updateModalWatchlistBtn();
            });
            function closeModal() { modal.classList.remove('active'); document.body.style.overflow = ''; }
            modalClose.addEventListener('click', closeModal);
            modal.addEventListener('click', (e) => { if(e.target === modal) closeModal(); });
            document.addEventListener('keydown', (e) => { if(e.key === 'Escape' && modal.classList.contains('active')) closeModal(); });

            // ═══════ HERO ═══════
            function buildHero(movies){
                heroMovies = movies.filter(m=>m.backdrop_path).slice(0,6);
                const heroEl=document.getElementById('hero');
                heroEl.innerHTML = '<div class="hero-dots" id="heroDots"></div>';
                const dotsEl = document.getElementById('heroDots');
                if(heroMovies.length===0){ heroEl.style.display='none'; return; }
                heroEl.style.display='block';
                heroMovies.forEach((m,i)=>{
                    const slide=document.createElement('div');
                    slide.className='hero-slide'+(i===0?' active':'');
                    slide.style.backgroundImage=`url(${TMDB_BACK+m.backdrop_path})`;
                    const title = esc(getTitle(m));
                    const year = getYear(m);
                    const type = getMediaType(m, null);
                    const rating = m.vote_average?Number(m.vote_average).toFixed(1):'?';
                    const match = m.vote_average ? Math.round(m.vote_average * 10) : 0;
                    const inWatchlist = watchlist.some(w=>w.id==m.id);
                    const playerPath = `/player/${m.id}/${type}`;
                    slide.innerHTML=`
                        <div class="hero-overlay"></div>
                        <div class="hero-content">
                            <div class="hero-label">H R &nbsp; O T T &nbsp; P R E S E N T</div>
                            <h1 class="hero-title">${title}</h1>
                            <div class="hero-meta">
                                <span class="match">${match}% Match</span>
                                <span>${year}</span>
                                <span class="maturity-badge">${rating}</span>
                                <span class="maturity-badge">${type === 'movie' ? 'MOVIE' : 'TV'}</span>
                            </div>
                            <div class="hero-buttons">
                                <a class="hero-watch" href="${playerPath}"><i class="fas fa-play"></i> Play Now</a>
                                <button class="hero-watchlist-btn ${inWatchlist?'active':''}" data-id="${m.id}" data-title="${esc(title)}" data-poster="${m.poster_path?TMDB_IMG+m.poster_path:''}" data-year="${year}" data-type="${type}"><i class="fas ${inWatchlist?'fa-check':'fa-plus'}"></i> ${inWatchlist?'In Watchlist':'Add to Watchlist'}</button>
                                <button class="hero-info" data-id="${m.id}" data-type="${type}"><i class="fas fa-info-circle"></i> More Info</button>
                            </div>
                        </div>`;
                    heroEl.appendChild(slide);
                    const dot=document.createElement('div');
                    dot.className='hero-dot'+(i===0?' active':'');
                    dot.addEventListener('click',()=>goHero(i));
                    dotsEl.appendChild(dot);
                });
                heroEl.querySelectorAll('.hero-watchlist-btn').forEach(btn => btn.addEventListener('click', e => { e.stopPropagation(); toggleWl(btn.dataset.id, btn.dataset.title, btn.dataset.poster, btn.dataset.year, btn.dataset.type); const inWl = watchlist.some(w=>w.id==btn.dataset.id); btn.classList.toggle('active', inWl); btn.innerHTML = `<i class="fas ${inWl?'fa-check':'fa-plus'}"></i> ${inWl?'In Watchlist':'Add to Watchlist'}`; }));
                heroEl.querySelectorAll('.hero-info').forEach(btn => btn.addEventListener('click', e => { e.stopPropagation(); openMovieModal(btn.dataset.id, btn.dataset.type); }));
                heroIdx=0; startHeroAuto();
            }
            function goHero(i){ const slides=document.querySelectorAll('#hero .hero-slide'), dots=document.querySelectorAll('#hero .hero-dot'); if(!slides.length) return; slides[heroIdx]?.classList.remove('active'); dots[heroIdx]?.classList.remove('active'); heroIdx=i; slides[heroIdx]?.classList.add('active'); dots[heroIdx]?.classList.add('active'); }
            function startHeroAuto(){ if(heroTimer) clearInterval(heroTimer); if(heroMovies.length>1) heroTimer=setInterval(()=>{ const slides=document.querySelectorAll('#hero .hero-slide'); if(slides.length) goHero((heroIdx+1)%slides.length); },8000); }
            function hideHero(){ if(heroTimer) clearInterval(heroTimer); document.getElementById('hero').style.display='none'; }
            function showHero(){ document.getElementById('hero').style.display='block'; }

            // ═══════ HOME ROWS ═══════
            function createRowSection(cfg){
                const sec=document.createElement('div'); sec.className='section';
                sec.innerHTML=`<h2 class="section-title">${cfg.title}</h2><div class="row-scroll-area"><button class="scroll-btn left"><i class="fas fa-chevron-left"></i></button><div class="row-track" id="grid-${cfg.key}"></div><button class="scroll-btn right"><i class="fas fa-chevron-right"></i></button></div>`;
                const track = sec.querySelector('.row-track');
                sec.querySelector('.scroll-btn.left').addEventListener('click', () => track.scrollBy({ left: -track.clientWidth * 0.85, behavior: 'smooth' }));
                sec.querySelector('.scroll-btn.right').addEventListener('click', () => track.scrollBy({ left: track.clientWidth * 0.85, behavior: 'smooth' }));
                return sec;
            }

            async function renderHome(){
                teardownWall();
                showHero();
                currentRoute = 'home';
                const container=document.getElementById('sectionsContainer'); container.innerHTML='';
                HOME_ROWS.forEach(c=>container.appendChild(createRowSection(c)));
                renderContinueWatching();
                const proms=HOME_ROWS.map(async c=>{ try{ const d=await tmdbFetch(c.ep+'1'); return {cfg:c, data:(d.results||[]).filter(m=>m.poster_path||m.backdrop_path)}; } catch(e){ return {cfg:c, data:[]}; } });
                const results=await Promise.all(proms);
                results.forEach(r=>{ const grid=document.getElementById('grid-'+r.cfg.key); if(!grid) return; r.data.slice(0,18).forEach(m=>{ const card=createCard(m, r.cfg.type); if(card) grid.appendChild(card); }); });
                const heroRow = results.find(r=>r.cfg.hero);
                if(heroRow && heroRow.data.length) buildHero(heroRow.data); else hideHero();
            }

            function teardownWall(){ if(wallState && wallState.observer) wallState.observer.disconnect(); wallState = null; }

            async function renderWall(catKey){
                teardownWall();
                hideHero();
                currentRoute = catKey === 'tv' ? 'series' : catKey;
                renderContinueWatching();
                const cfg = WALLS[catKey];
                const container=document.getElementById('sectionsContainer');
                container.innerHTML = `<div class="section"><h2 class="section-title">${cfg.title}</h2><div class="grid-wall" id="wallGrid"></div><div class="grid-loader" id="wallLoader"><i class="fas fa-circle-notch fa-spin"></i> Loading…</div><div class="grid-sentinel" id="wallSentinel"></div></div>`;
                wallState = { page:0, ep:cfg.ep, type:cfg.type, loading:false, ended:false, observer:null };
                await loadWallPage();
                if(wallState){ const sentinel = document.getElementById('wallSentinel'); wallState.observer = new IntersectionObserver(entries=>{ if(entries[0].isIntersecting) loadWallPage(); },{ rootMargin:'600px' }); wallState.observer.observe(sentinel); }
            }

            async function loadWallPage(){
                if(!wallState || wallState.loading || wallState.ended) return;
                wallState.loading = true;
                const grid=document.getElementById('wallGrid'); const loader=document.getElementById('wallLoader');
                const page = wallState.page + 1;
                try{
                    const data = await tmdbFetch(wallState.ep + page);
                    const results = (data.results||[]).filter(m=>m.poster_path);
                    if(!grid) return;
                    if(results.length){
                        results.forEach(m=>{ const t = wallState.type === 'mixed' ? getMediaType(m, null) : wallState.type; const card = createCard(m, t); if(card) grid.appendChild(card); });
                        wallState.page = page;
                        if(page >= (data.total_pages||500) || page >= 500){ wallState.ended=true; if(loader) loader.style.display='none'; }
                    } else { wallState.ended = true; if(loader) loader.style.display='none'; }
                }catch(e){ if(loader) loader.style.display='none'; }
                finally { if(wallState) wallState.loading = false; }
            }

            function renderMyList(){
                teardownWall(); hideHero();
                currentRoute = 'my-list';
                renderContinueWatching();
                const container = document.getElementById('sectionsContainer');
                container.innerHTML = '';
                if (watchlist.length === 0) { container.innerHTML = `<div class="empty-state"><i class="fas fa-heart"></i><h2>Your list is empty</h2><p>Add movies and shows to your list to watch them later.</p></div>`; return; }
                const sec = document.createElement('div'); sec.className = 'section'; sec.innerHTML = `<h2 class="section-title">My List</h2><div class="grid-wall" id="grid-mylist"></div>`; container.appendChild(sec);
                const grid = document.getElementById('grid-mylist');
                watchlist.forEach(item => { const card=createCard({ id:item.id, title:item.title, poster_path:null, backdrop_path:null, release_date:(item.year||'')+'-01-01', vote_average:0 }, item.type); if(!card) return; const img=card.querySelector('img'); if(item.poster) img.src=item.poster; card.querySelector('.card-rating').innerHTML='<i class="fas fa-heart" style="color:var(--red)"></i>'; grid.appendChild(card); });
            }

            // ═══════ SEARCH with country & language filters ═══════
            const searchOverlay = document.getElementById('searchOverlay');
            const searchOverlayInput = document.getElementById('searchOverlayInput');
            const searchOverlayClose = document.getElementById('searchOverlayClose');
            const searchOpenBtn = document.getElementById('searchOpenBtn');
            const searchResults = document.getElementById('searchResults');
            const searchTypeFilter = document.getElementById('searchTypeFilter');
            const searchGenreFilter = document.getElementById('searchGenreFilter');
            const searchYearFilter = document.getElementById('searchYearFilter');
            const searchLanguageFilter = document.getElementById('searchLanguageFilter');
            const searchCountryFilter = document.getElementById('searchCountryFilter');
            const searchSortFilter = document.getElementById('searchSortFilter');
            let searchTimeout;

            function openSearch() {
                searchOverlay.classList.add('active');
                document.body.style.overflow = 'hidden';
                setTimeout(() => searchOverlayInput.focus(), 100);
            }
            function closeSearch() {
                searchOverlay.classList.remove('active');
                document.body.style.overflow = '';
                searchOverlayInput.value = '';
                searchResults.innerHTML = '';
            }

            searchOpenBtn.addEventListener('click', openSearch);
            searchOverlayClose.addEventListener('click', closeSearch);

            function buildSearchEndpoint(page = 1) {
                const query = searchOverlayInput.value.trim();
                const type = searchTypeFilter.value;
                const genre = searchGenreFilter.value;
                const year = searchYearFilter.value;
                const language = searchLanguageFilter.value;
                const country = searchCountryFilter.value;
                const sort = searchSortFilter.value;

                if (query.length >= 2) {
                    return `/search/multi?query=${encodeURIComponent(query)}&page=${page}`;
                } else {
                    let base = '/discover/movie';
                    if (type === 'tv') base = '/discover/tv';
                    const params = new URLSearchParams();
                    if (genre !== 'all') params.set('with_genres', genre);
                    if (year !== 'all') params.set('primary_release_year', year);
                    if (language !== 'all') params.set('with_original_language', language);
                    if (country !== 'all') params.set('with_origin_country', country);
                    params.set('sort_by', sort);
                    params.set('page', page);
                    return `${base}?${params.toString()}`;
                }
            }

            async function performSearch() {
                const query = searchOverlayInput.value.trim();
                const hasFilters = searchTypeFilter.value !== 'multi' || searchGenreFilter.value !== 'all' || 
                                  searchYearFilter.value !== 'all' || searchLanguageFilter.value !== 'all' || 
                                  searchCountryFilter.value !== 'all';
                if (query.length < 2 && !hasFilters) {
                    searchResults.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-muted);">Type to search or use filters</div>';
                    return;
                }
                searchResults.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-muted);"><i class="fas fa-spinner fa-spin"></i> Searching...</div>';
                try {
                    const endpoint = buildSearchEndpoint(1);
                    const data = await tmdbFetch(endpoint);
                    const items = (data.results || []).filter(m => m.poster_path).slice(0, 20);
                    if (items.length === 0) {
                        searchResults.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-muted);">No results found</div>';
                        return;
                    }
                    searchResults.innerHTML = items.map(item => {
                        const poster = item.poster_path ? TMDB_IMG + item.poster_path : '';
                        const title = getTitle(item);
                        const year = getYear(item);
                        const rating = item.vote_average ? Number(item.vote_average).toFixed(1) : '?';
                        const type = getMediaType(item, searchTypeFilter.value !== 'multi' ? searchTypeFilter.value : null);
                        const typeLabel = type === 'movie' ? 'Movie' : 'TV';
                        const detailPath = type === 'movie' ? `/movie/${item.id}` : `/series/${item.id}`;
                        return `<a class="search-result-card" href="${detailPath}" data-id="${item.id}" data-type="${type}">
                            <img src="${poster}" alt="${esc(title)}" onerror="this.style.background='#222';this.style.opacity='0.5';">
                            <div class="search-result-info">
                                <div class="search-result-title">${esc(title)}</div>
                                <div class="search-result-meta">★ ${rating} · ${year} · ${typeLabel}</div>
                            </div>
                        </a>`;
                    }).join('');
                    searchResults.querySelectorAll('.search-result-card').forEach(card => {
                        card.addEventListener('click', (e) => {
                            e.preventDefault();
                            closeSearch();
                            openMovieModal(card.dataset.id, card.dataset.type);
                        });
                    });
                } catch (e) {
                    searchResults.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-muted);">Search error</div>';
                }
            }

            searchOverlayInput.addEventListener('input', function() {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(performSearch, 400);
            });

            [searchTypeFilter, searchGenreFilter, searchYearFilter, searchLanguageFilter, searchCountryFilter, searchSortFilter].forEach(filter => {
                filter.addEventListener('change', performSearch);
            });

            // ═══════ NAVIGATION ═══════
            function navigateTo(route) {
                if (route === 'home') window.history.pushState({}, '', '/');
                else if (route === 'movies') window.history.pushState({}, '', '/movies');
                else if (route === 'series') window.history.pushState({}, '', '/series');
                else if (route === 'new') window.history.pushState({}, '', '/new');
                else if (route === 'my-list') window.history.pushState({}, '', '/my-list');
                
                document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
                document.querySelectorAll('.bottom-nav-item').forEach(a => a.classList.remove('active'));
                document.querySelector(`[data-route="${route}"]`)?.classList.add('active');
                
                if (route === 'home') renderHome();
                else if (route === 'movies') renderWall('movies');
                else if (route === 'series') renderWall('tv');
                else if (route === 'new') renderWall('new');
                else if (route === 'my-list') renderMyList();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            document.querySelectorAll('.nav-links a').forEach(link => {
                link.addEventListener('click', (e) => { e.preventDefault(); navigateTo(link.dataset.route); });
            });

            document.querySelectorAll('.bottom-nav-item').forEach(item => {
                item.addEventListener('click', (e) => { e.preventDefault(); navigateTo(item.dataset.route); });
            });

            // ═══════ BACK TO TOP ═══════
            const backBtn = document.getElementById('backToTop');
            window.addEventListener('scroll', () => { backBtn.classList.toggle('visible', window.scrollY > 600); document.getElementById('mainNav').classList.toggle('scrolled', window.scrollY > 30); });
            backBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

            document.getElementById('watchlistBtnNav').addEventListener('click', () => { navigateTo('my-list'); });
            document.getElementById('clearRecentBtn')?.addEventListener('click', () => {
                recent = [];
                saveRec();
                renderContinueWatching();
                toast('Watch history cleared');
            });

            // ═══════ INIT ═══════
            async function init() {
                loadStorage();
                if (watchlist.length > 0) document.getElementById('watchlistBtnNav').querySelector('i').className = 'fas fa-heart';
                await loadConfiguration();
                renderContinueWatching();
                await renderHome();
                setTimeout(() => { document.getElementById('loadingScreen').classList.add('hidden'); setTimeout(() => { const ls = document.getElementById('loadingScreen'); if (ls) ls.remove(); }, 600); }, 2600);
                refreshHearts();
            }
            init();
        })();
    </script>
</body>
</html>
