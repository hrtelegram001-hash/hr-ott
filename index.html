<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>HR OTT — Watch Movies & Series</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0b0b0f; --bg-2: #101015; --bg-card: #16161c; --bg-elevated: #23232c;
            --red: #E50914; --red-dark: #B20710; --red-glow: rgba(229,9,20,0.45);
            --gold: #f5c518; --text: #ffffff; --text-muted: #b3b3b3; --text-dim: #7c7c85;
            --green: #46d369; --pad: clamp(12px, 3.2vw, 46px); --gap: 10px;
            --poster-min: clamp(150px, 18vw, 220px); /* INCREASED from 104-172px to 150-220px */
            --bottom-nav-height: 65px; --nav-height: 70px;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        html { scroll-behavior:smooth; -webkit-tap-highlight-color:transparent; }
        body {
            background: radial-gradient(1200px 600px at 80% -10%, rgba(229,9,20,0.10), transparent 60%), radial-gradient(900px 500px at 0% 10%, rgba(80,0,120,0.10), transparent 55%), var(--bg);
            color: var(--text); font-family: 'Inter', system-ui, sans-serif; overflow-x: hidden;
            min-height: 100vh; -webkit-font-smoothing: antialiased; position: relative; padding-top: var(--nav-height);
        }
        #starCanvas { position: fixed; inset:0; z-index:-2; pointer-events:none; opacity:0.28; }
        #cursorGlow { position: fixed; width: 460px; height: 460px; background: radial-gradient(circle, rgba(229,9,20,0.16) 0%, transparent 70%); border-radius: 50%; pointer-events: none; z-index: 9998; transform: translate(-50%,-50%); filter: blur(48px); }
        .loading-screen { position: fixed; inset:0; background: var(--bg); z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.6s, visibility 0.6s; }
        .loading-screen.hidden { opacity:0; visibility:hidden; pointer-events:none; }
        .loading-logo { font-family: 'Bebas Neue', sans-serif; font-size: clamp(3rem, 13vw, 9rem); font-weight: 900; color: var(--red); letter-spacing: 4px; opacity: 0; animation: netflixIntro 2.5s cubic-bezier(0.165, 0.84, 0.44, 1) forwards; text-shadow: 0 0 50px var(--red-glow); }
        @keyframes netflixIntro { 0% { transform: scale(1.5); opacity: 0; filter: blur(15px); letter-spacing: 16px; } 40% { opacity: 1; filter: blur(2px); letter-spacing: 8px; } 70% { transform: scale(1); opacity: 1; filter: blur(0); letter-spacing: 4px; } 100% { opacity: 1; } }
        .loading-bar-container { width: 300px; height: 4px; background: rgba(255,255,255,0.1); margin-top: 42px; border-radius: 2px; overflow: hidden; opacity: 0; animation: fadeBarIn 0.5s ease 1s forwards; }
        @keyframes fadeBarIn { to { opacity: 1; } }
        .loading-bar-fill { width: 0%; height: 100%; background: linear-gradient(90deg, var(--red-dark), var(--red)); animation: loadFill 1.5s ease-in-out 1s forwards; }
        @keyframes loadFill { 0% {width:0%;} 100% {width:100%;} }
        
        .nav { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; height: var(--nav-height); display: flex; align-items: center; gap: 22px; background: rgba(11,11,15,0.95); backdrop-filter: blur(14px); border-bottom: 1px solid rgba(255,255,255,0.08); padding: 0 var(--pad); }
        .nav-logo { font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem; font-weight: 900; color: var(--red); letter-spacing: 1px; text-transform: uppercase; cursor: pointer; text-shadow: 0 0 20px var(--red-glow); text-decoration: none; }
        .nav-links { display: flex; gap: 18px; font-size: 14px; font-weight: 500; }
        .nav-links a { color: var(--text-muted); text-decoration: none; transition: all 0.2s; cursor: pointer; position: relative; padding-bottom: 4px; }
        .nav-links a::after { content: ''; position: absolute; bottom: 0; left: 50%; width: 0; height: 2px; background: var(--red); transition: all 0.3s; transform: translateX(-50%); }
        .nav-links a:hover, .nav-links a.active { color: var(--text); font-weight: 700; }
        .nav-links a:hover::after, .nav-links a.active::after { width: 100%; }
        .nav-links a.anime-link { color: #ff6b9d; }
        .nav-links a.anime-link::after { background: #ff6b9d; }
        .nav-right { margin-left: auto; display: flex; align-items: center; gap: 18px; }
        .watchlist-btn-nav { background: none; border: none; font-size: 1.3rem; color: #fff; cursor: pointer; position: relative; }
        .watchlist-badge { position: absolute; top: -8px; right: -8px; background: var(--red); color: white; font-size: 0.6rem; font-weight: 700; width: 18px; height: 18px; border-radius: 50%; display: none; align-items: center; justify-content: center; }
        .watchlist-badge.visible { display: flex; }
        .profile-avatar { width: 34px; height: 34px; border-radius: 8px; background: linear-gradient(135deg, var(--red), #4a0408); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; }
        
        .hero { height: calc(88vh - var(--nav-height)); min-height: 560px; position: relative; overflow: hidden; }
        .hero-slide { position: absolute; inset:0; background-size: cover; background-position: center; opacity: 0; transition: opacity 1.2s ease; }
        .hero-slide.active { opacity:1; z-index:2; animation: kenBurns 24s ease-in-out infinite alternate; }
        @keyframes kenBurns { from { transform: scale(1.0); } to { transform: scale(1.12); } }
        .hero-overlay { position: absolute; inset:0; z-index: 3; background: linear-gradient(180deg, rgba(11,11,15,0) 30%, rgba(11,11,15,0.45) 62%, rgba(11,11,15,1) 100%), linear-gradient(90deg, rgba(11,11,15,0.92) 0%, rgba(11,11,15,0.35) 52%, rgba(11,11,15,0) 100%); }
        .hero-content { position: absolute; bottom: 26%; left: var(--pad); z-index: 4; max-width: 620px; }
        .hero-title { font-size: clamp(2.4rem, 6vw, 5.2rem); font-weight: 900; line-height: 0.95; margin-bottom: 16px; text-shadow: 2px 4px 26px rgba(0,0,0,0.9); letter-spacing: -2px; }
        .hero-buttons { display: flex; gap: 12px; flex-wrap: wrap; }
        .hero-watch, .hero-info, .hero-watchlist-btn { display: flex; align-items: center; gap: 10px; padding: 13px 30px; border: none; border-radius: 6px; font-size: 17px; font-weight: 700; cursor: pointer; text-decoration: none; }
        .hero-watch { background: white; color: black; }
        .hero-info { background: rgba(60,60,68,0.7); color: white; }
        .hero-watchlist-btn { background: rgba(229,9,20,0.2); color: white; border: 1px solid var(--red); }
        .hero-watchlist-btn.active { background: var(--red); }
        .hero-dots { position: absolute; bottom: 26%; right: var(--pad); z-index: 4; display: flex; gap: 6px; }
        .hero-dot { width: 30px; height: 3px; background: rgba(255,255,255,0.3); cursor: pointer; border-radius: 2px; }
        .hero-dot.active { background: var(--red); }
        
        .main-content { position: relative; z-index: 5; margin-top: -70px; padding-bottom: 30px; min-height: 60vh; }
        .main-content.no-hero { margin-top: 0; }
        .page-header { position: sticky; top: var(--nav-height); z-index: 100; padding: 20px var(--pad); background: rgba(11,11,15,0.95); backdrop-filter: blur(14px); border-bottom: 1px solid rgba(255,255,255,0.08); }
        .page-title { font-size: clamp(1.5rem, 3vw, 2.5rem); font-weight: 900; display: flex; align-items: center; gap: 12px; }
        .page-title i { color: var(--red); }
        .page-subtitle { color: var(--text-muted); font-size: 0.85rem; margin-top: 4px; }
        .breadcrumb { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: var(--text-dim); margin-bottom: 8px; }
        .breadcrumb a { color: var(--text-muted); text-decoration: none; }
        .breadcrumb .current { color: var(--text); font-weight: 600; }
        
        .continue-watching-section { margin: 0 0 30px; padding: 20px 0; display: none; }
        .continue-watching-section.visible { display: block; }
        .section-header { display: flex; align-items: center; justify-content: space-between; padding: 0 var(--pad); margin-bottom: 15px; }
        .section-title { font-size: 1.4rem; font-weight: 800; display: flex; align-items: center; gap: 12px; padding: 0 var(--pad); margin-bottom: 15px; }
        .section-title::before { content:''; width:4px; height:24px; border-radius:2px; background: var(--red); box-shadow: 0 0 12px var(--red-glow); }
        .section-action { color: var(--text-muted); font-size: 0.85rem; cursor: pointer; background: none; border: none; font-weight: 600; }
        .section { margin: 0 0 26px; position: relative; }
        .row-scroll-area { position: relative; }
        .row-track { display: flex; gap: var(--gap); padding: 8px var(--pad) 14px; overflow-x: auto; scrollbar-width: none; }
        .row-track::-webkit-scrollbar { display: none; }
        .scroll-btn { position: absolute; top: 0; bottom: 0; width: 56px; background: linear-gradient(90deg, rgba(11,11,15,0.95), transparent); border: none; color: white; font-size: 2rem; cursor: pointer; opacity: 0; transition: opacity 0.3s; z-index: 30; }
        .scroll-btn.right { right: 0; background: linear-gradient(-90deg, rgba(11,11,15,0.95), transparent); }
        .scroll-btn.left { left: 0; }
        .section:hover .scroll-btn, .continue-watching-section:hover .scroll-btn { opacity: 1; }
        
        .grid-wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--poster-min), 1fr)); gap: var(--gap); padding: 8px var(--pad) 20px; }
        .card { position: relative; cursor: pointer; border-radius: 8px; overflow: hidden; background: var(--bg-card); transition: transform 0.35s, box-shadow 0.35s; text-decoration: none; color: var(--text); display: block; }
        .card:hover { transform: scale(1.06) translateY(-4px); z-index: 60; box-shadow: 0 24px 50px rgba(0,0,0,0.85), 0 0 0 2px rgba(229,9,20,0.55); }
        .card-thumb { position: relative; width: 100%; aspect-ratio: 2/3; background: #14141a; overflow: hidden; }
        .card-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.5s ease; }
        .card:hover .card-thumb img { transform: scale(1.06); }
        .card-rating { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.72); backdrop-filter: blur(4px); padding: 4px 8px; border-radius: 5px; font-size: 0.8rem; font-weight: 700; }
        .card-rating i { color: var(--gold); font-size: 0.75rem; }
        .card-toplist { position: absolute; top: 8px; right: 8px; background: var(--red); color: #fff; font-size: 0.65rem; font-weight: 800; padding: 3px 8px; border-radius: 5px; text-transform: uppercase; }
        .card-overlay { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 35%, rgba(0,0,0,0.55) 65%, rgba(0,0,0,0.96) 100%); opacity: 0; display: flex; flex-direction: column; justify-content: flex-end; padding: 14px; transition: opacity 0.28s; }
        .card:hover .card-overlay { opacity: 1; }
        .card-name { font-weight: 700; font-size: 0.95rem; line-height: 1.2; margin-bottom: 4px; }
        .card-sub { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .card-sub .match { color: var(--green); font-weight: 700; }
        .card-buttons { display: flex; gap: 6px; }
        .circle-btn { width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.55); background: rgba(30,30,36,0.7); color: white; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 13px; transition: all 0.2s; }
        .circle-btn:hover { border-color: white; background: rgba(80,80,90,0.9); transform: scale(1.08); }
        .circle-btn.play-btn { background: white; color: black; border-color: white; }
        .circle-btn.play-btn:hover { background: rgba(255,255,255,0.82); }
        .card-heart.fas { color: var(--red); }
        
        .empty-state { text-align: center; padding: 110px 20px; color: #888; }
        .empty-state i { font-size: 3rem; margin-bottom: 20px; color: var(--red); }
        .not-found-container { text-align: center; padding: 100px 20px; }
        .not-found-code { font-size: 6rem; color: var(--red); font-weight: 900; }
        .not-found-btn { display: inline-block; margin-top: 20px; padding: 14px 30px; background: var(--red); color: white; border-radius: 8px; text-decoration: none; font-weight: 700; }
        .footer-wrapper { position: relative; z-index: 5; }
        footer { padding: 30px var(--pad); color: var(--text-dim); font-size: 13px; border-top: 1px solid rgba(255,255,255,0.08); text-align: center; }
        .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: rgba(24,24,28,0.97); color: white; padding: 14px 22px; border-radius: 8px; border-left: 4px solid var(--red); z-index: 9999; font-size: 14px; }
        .back-to-top { position: fixed; bottom: 80px; right: 30px; width: 50px; height: 50px; border-radius: 50%; background: var(--red); display: none; align-items: center; justify-content: center; color: #fff; cursor: pointer; z-index: 90; border: none; }
        .back-to-top.visible { display: flex; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: var(--bottom-nav-height); background: rgba(11,11,15,0.98); border-top: 1px solid rgba(255,255,255,0.1); display: none; z-index: 500; align-items: center; justify-content: space-around; }
        .bottom-nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-muted); text-decoration: none; font-size: 0.7rem; font-weight: 600; }
        .bottom-nav-item.active { color: var(--red); }
        
        @media (max-width: 900px) {
            .nav-links { display: none; }
            .hero { height: calc(78vh - var(--nav-height)); }
            .bottom-nav { display: flex; }
            body { padding-bottom: var(--bottom-nav-height); }
            :root { --poster-min: clamp(130px, 22vw, 180px); } /* Mobile size adjustment */
        }
        
        @media (min-width: 1200px) {
            :root { --poster-min: clamp(180px, 16vw, 240px); } /* Desktop larger */
        }
    </style>
</head>
<body>

    <div id="cursorGlow"></div>
    <div class="loading-screen" id="loadingScreen">
        <div class="loading-logo">HR&nbsp;OTT</div>

    <nav class="nav" id="mainNav">
        <a href="/" class="nav-logo">HR OTT</a>
        <div class="nav-links">
            <a href="/" class="active" data-route="home">Home</a>
            <a href="/search" data-route="search">Search</a>
            <a href="/anime" data-route="anime" class="anime-link"><i class="fas fa-dragon"></i> Anime</a>

            <a href="/new" data-route="new">New & Popular</a>

        </div>
        <div class="nav-right">
            <button class="watchlist-btn-nav" id="watchlistBtnNav">
                <i class="fas fa-bell"></i>
                <span class="watchlist-badge" id="watchlistBadge">0</span>
            </button>
            <div class="profile-avatar">HR</div>
        </div>
    </nav>
    
    <div class="hero" id="hero"><div class="hero-dots" id="heroDots"></div></div>
    
    <div class="main-content" id="mainContent">
        <div class="continue-watching-section" id="continueWatchingSection">
            <div class="section-header">
                <h2 class="section-title">Continue Watching</h2>
                <button class="section-action" id="clearRecentBtn">Clear All</button>
            </div>
            <div class="row-scroll-area">
                <button class="scroll-btn left"><i class="fas fa-chevron-left"></i></button>
                <div class="row-track" id="recentGrid"></div>
                <button class="scroll-btn right"><i class="fas fa-chevron-right"></i></button>
            </div>
        </div>
        <div id="sectionsContainer"></div>
    </div>
    
    <div class="footer-wrapper" id="footerWrapper">
        <footer>
            <p>© 2026 HR OTT — Watch Movies & Series.</p>
            <div class="developer-credits">
                <div class="dev-line">Developed by <span>YATIN GOYAL</span></div>
            </div>
        </footer>
    </div>
    
    <button class="back-to-top" id="backToTop"><i class="fas fa-arrow-up"></i></button>
    
    <div class="bottom-nav" id="bottomNav">
        <a href="/" class="bottom-nav-item active" data-route="home"><i class="fas fa-home"></i><span>Home</span></a>
        <a href="/search" class="bottom-nav-item" data-route="search"><i class="fas fa-search"></i><span>Search</span></a>
        <a href="/anime" class="bottom-nav-item" data-route="anime"><i class="fas fa-dragon"></i><span>Anime</span></a>
        <a href="/movies" class="bottom-nav-item" data-route="movies"><i class="fas fa-film"></i><span>Movies</span></a>
        <a href="/series" class="bottom-nav-item" data-route="series"><i class="fas fa-tv"></i><span>Series</span></a>
        <a href="/my-list" class="bottom-nav-item" data-route="my-list"><i class="fas fa-bookmark"></i><span>My List</span></a>
    </div>

    <script>
        'use strict';
        (function() {
            const canvas = document.getElementById('starCanvas');
            const ctx = canvas.getContext('2d');
            let stars = [];
            function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            function createStars(n) { stars = []; for(let i=0;i<n;i++) stars.push({ x:Math.random()*canvas.width, y:Math.random()*canvas.height, r:Math.random()*1.5+0.5, a:Math.random(), da:(Math.random()*0.04+0.008), s:Math.random()*0.06+0.02 }); }
            createStars(150);
            function drawStars() { ctx.clearRect(0,0,canvas.width,canvas.height); stars.forEach(s => { ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fillStyle = `rgba(255,250,255,${s.a * 0.5})`; ctx.fill(); s.a += s.da; if(s.a<=0.1 || s.a>=0.9) s.da*=-1; s.y += s.s; if(s.y>canvas.height){ s.y=0; s.x=Math.random()*canvas.width; } }); requestAnimationFrame(drawStars); }
            drawStars();

            const cursorGlow = document.getElementById('cursorGlow');
            let rafId=null, mx=0, my=0;
            document.addEventListener('mousemove', e => { mx=e.clientX; my=e.clientY; if(!rafId) rafId = requestAnimationFrame(()=>{ cursorGlow.style.transform = `translate(${mx}px, ${my}px)`; rafId=null; }); });

            const TMDB_KEY = '3a87b1db63bc74b8e3fe9266ddc75b30';
            const TMDB_BASE = 'https://api.themoviedb.org/3';
            const TMDB_IMG = 'https://image.tmdb.org/t/p/w500';
            const TMDB_BACK = 'https://image.tmdb.org/t/p/original';
            
            const ANILIST_API = 'https://graphql.anilist.co';

            const HOME_ROWS = [
                { key:'trending', title:'Trending Now', ep:'/trending/movie/week?page=', type:'movie', hero:true },
                { key:'toprated', title:'Top Rated Movies', ep:'/movie/top_rated?page=', type:'movie' },
                { key:'popular', title:'Popular Movies', ep:'/movie/popular?page=', type:'movie' },
                { key:'action', title:'Action & Adventure', ep:'/discover/movie?with_genres=28&sort_by=popularity.desc&page=', type:'movie' },
                { key:'scifi', title:'Sci-Fi & Fantasy', ep:'/discover/movie?with_genres=878&sort_by=popularity.desc&page=', type:'movie' },
                { key:'horror', title:'Horror & Thrillers', ep:'/discover/movie?with_genres=27&sort_by=popularity.desc&page=', type:'movie' },
                { key:'comedy', title:'Comedy', ep:'/discover/movie?with_genres=35&sort_by=popularity.desc&page=', type:'movie' },
                { key:'animation', title:'Animation', ep:'/discover/movie?with_genres=16&sort_by=popularity.desc&page=', type:'movie' },
                { key:'romance', title:'Romance', ep:'/discover/movie?with_genres=10749&sort_by=popularity.desc&page=', type:'movie' },
                { key:'bollywood', title:'Bollywood', ep:'/discover/movie?with_original_language=hi&sort_by=popularity.desc&page=', type:'movie' },
                { key:'tvshows', title:'Trending TV Shows', ep:'/trending/tv/week?page=', type:'tv' },
            ];
            const WALLS = {
                movies: { title:'Movies', ep:'/discover/movie?sort_by=popularity.desc&vote_count.gte=50&page=', type:'movie', icon:'fa-film', subtitle:'Browse all movies in our collection' },
                tv: { title:'TV Shows', ep:'/discover/tv?sort_by=popularity.desc&vote_count.gte=50&page=', type:'tv', icon:'fa-tv', subtitle:'Discover amazing TV series' },
                new: { title:'New & Popular', ep:'/trending/all/week?page=', type:'mixed', icon:'fa-star', subtitle:'What\'s trending this week' },
            };

            let watchlist=[], recent=[], heroMovies=[], heroIdx=0, heroTimer;
            let wallState = null;
            let currentRoute = 'home';
            let allGenres = [], allLanguages = [], allCountries = [];

            function loadStorage() { try { watchlist = JSON.parse(localStorage.HR_wl||'[]'); recent = JSON.parse(localStorage.HR_rec||'[]'); } catch(e){ watchlist=[]; recent=[]; } }
            function saveWl(){ localStorage.HR_wl = JSON.stringify(watchlist); updateWatchlistBadge(); }
            function saveRec(){ localStorage.HR_rec = JSON.stringify(recent); }
            function updateWatchlistBadge() {
                const badge = document.getElementById('watchlistBadge');
                if (badge) { badge.textContent = watchlist.length; badge.classList.toggle('visible', watchlist.length > 0); }
            }

            async function tmdbFetch(endpoint) {
                const sep = endpoint.includes('?') ? '&' : '?';
                const url = `${TMDB_BASE}${endpoint}${sep}api_key=${TMDB_KEY}`;
                try { const res = await fetch(url); if (!res.ok) return { results: [], genres: [], total_pages: 0, page: 1 }; return await res.json(); }
                catch (e) { return { results: [], genres: [], total_pages: 0, page: 1 }; }
            }
            function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
            function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.innerHTML=`<i class="fas fa-check-circle"></i> ${msg}`; document.body.appendChild(t); setTimeout(()=>t.remove(), 2200); }
            function getTitle(item) { return item.title || item.name || 'Untitled'; }
            function getYear(item) { return (item.release_date || item.first_air_date || '').substring(0,4); }
            function getMediaType(item, forcedType) { return forcedType || item.media_type || 'movie'; }

            async function loadConfiguration() {
                try {
                    const movieGenres = await tmdbFetch('/genre/movie/list');
                    const tvGenres = await tmdbFetch('/genre/tv/list');
                    const combined = [...(movieGenres.genres||[]), ...(tvGenres.genres||[])];
                    allGenres = combined.filter((v,i,a)=>a.findIndex(t=>t.id===v.id)===i);
                    allLanguages = await tmdbFetch('/configuration/languages') || [];
                    allCountries = await tmdbFetch('/configuration/countries') || [];
                } catch(e) { allGenres = []; allLanguages = []; allCountries = []; }
            }

            function createCard(item, forcedType, progress){
                const type = getMediaType(item, forcedType);
                if(type !== 'movie' && type !== 'tv') return null;
                const posterPath = item.poster_path ? TMDB_IMG + item.poster_path : '';
                const title = getTitle(item);
                const year = getYear(item);
                const rating = item.vote_average?Number(item.vote_average).toFixed(1):'?';
                const match = item.vote_average ? Math.round(item.vote_average * 10) : 0;
                const id = item.id;
                const top = item.vote_average >= 8;
                const card = document.createElement('a');
                card.className='card'; card.href = 'javascript:void(0)';
                card.dataset.id = id; card.dataset.type = type; card.dataset.title = title;
                card.dataset.poster = posterPath; card.dataset.year = year;
                card.innerHTML = `
                    <div class="card-thumb">
                        <img src="${posterPath}" loading="lazy" alt="${esc(title)}" onerror="this.style.background='#1a1a20';this.style.opacity='0';">
                        <div class="card-rating"><i class="fas fa-star"></i>${rating}</div>
                        ${top?'<div class="card-toplist">Top</div>':''}
                        ${progress ? `<div class="progress-bar" style="position:absolute;bottom:0;left:0;height:3px;background:var(--red);width:${progress}%;"></div>` : ''}
                        <div class="card-overlay">
                            <div class="card-name">${esc(title)}</div>
                            <div class="card-sub"><span class="match">${match}% Match</span><span>${year||''}</span><span>${type === 'movie' ? 'Movie' : 'TV'}</span></div>
                            <div class="card-buttons">
                                <button class="circle-btn play-btn" data-play data-id="${id}" data-type="${type}" title="Play"><i class="fas fa-play"></i></button>
                                <button class="circle-btn card-heart" data-heart data-id="${id}" title="My List"><i class="far fa-heart"></i></button>
                            </div>
                        </div>
                    </div>`;
                card.addEventListener('click', (e) => {
                    e.preventDefault();
                    if (e.target.closest('[data-play]') || e.target.closest('[data-heart]')) return;
                    window.location.href = `/player.html?id=${id}&type=${type}`;
                });
                const playBtn = card.querySelector('[data-play]');
                if (playBtn) playBtn.addEventListener('click', (e) => {
                    e.preventDefault(); e.stopPropagation();
                    addRecent(id, title, posterPath, year, type);
                    window.location.href = `/player.html?id=${id}&type=${type}`;
                });
                const heartBtn = card.querySelector('[data-heart]');
                if (heartBtn) heartBtn.addEventListener('click', (e) => {
                    e.preventDefault(); e.stopPropagation();
                    toggleWl(id, title, posterPath, year, type);
                    updateHeart(card, id);
                });
                updateHeart(card, id);
                return card;
            }

            function updateHeart(card, id){ const i = card.querySelector('.card-heart i'); if (i) i.className = watchlist.some(w=>w.id==id) ? 'fas fa-heart' : 'far fa-heart'; }
            function refreshHearts(){ document.querySelectorAll('.card').forEach(c=>updateHeart(c,c.dataset.id)); }
            function toggleWl(id,title,poster,year,type){
                const idx=watchlist.findIndex(w=>w.id==id);
                if(idx>=0){ watchlist.splice(idx,1); toast('Removed from My List'); }
                else { watchlist.push({id,title,poster,year,type}); toast('Added to My List'); }
                saveWl(); refreshHearts();
                if (currentRoute === 'my-list') renderMyList();
            }
            function addRecent(id,title,poster,year,type){
                recent=recent.filter(r=>r.id!=id);
                recent.unshift({id,title,poster,year,type, progress: Math.floor(Math.random()*80)+10});
                if(recent.length>12) recent.pop();
                saveRec(); renderContinueWatching();
            }
            function renderContinueWatching(){
                const section = document.getElementById('continueWatchingSection');
                const grid = document.getElementById('recentGrid');
                if (!section || !grid) return;
                if (recent.length === 0 || currentRoute !== 'home') { section.classList.remove('visible'); return; }
                section.classList.add('visible');
                grid.innerHTML = '';
                recent.slice(0, 10).forEach(r => {
                    const c = createCard({ id: r.id, title: r.title, poster_path: null, release_date: (r.year||'')+'-01-01', vote_average: 0 }, r.type, r.progress);
                    if (!c) return;
                    const img = c.querySelector('img');
                    if (r.poster) img.src = r.poster;
                    grid.appendChild(c);
                });
            }

            function buildHero(movies){
                heroMovies = movies.filter(m=>m.backdrop_path).slice(0,6);
                const heroEl=document.getElementById('hero');
                heroEl.innerHTML = '<div class="hero-dots" id="heroDots"></div>';
                if(heroMovies.length===0){ heroEl.style.display='none'; return; }
                heroEl.style.display='block';
                heroMovies.forEach((m,i)=>{
                    const slide=document.createElement('div');
                    slide.className='hero-slide'+(i===0?' active':'');
                    slide.style.backgroundImage=`url(${TMDB_BACK+m.backdrop_path})`;
                    slide.innerHTML=`
                        <div class="hero-overlay"></div>
                        <div class="hero-content">
                            <h1 class="hero-title">${esc(getTitle(m))}</h1>
                            <div class="hero-buttons">
                                <a class="hero-watch" href="/player.html?id=${m.id}&type=${getMediaType(m,null)}"><i class="fas fa-play"></i> Play Now</a>
                            </div>
                        </div>`;
                    heroEl.appendChild(slide);
                });
                heroIdx=0; startHeroAuto();
            }
            function goHero(i){ const slides=document.querySelectorAll('#hero .hero-slide'); if(!slides.length) return; slides[heroIdx]?.classList.remove('active'); heroIdx=i; slides[heroIdx]?.classList.add('active'); }
            function startHeroAuto(){ if(heroTimer) clearInterval(heroTimer); if(heroMovies.length>1) heroTimer=setInterval(()=>{ goHero((heroIdx+1)%heroMovies.length); },8000); }
            function hideHero(){ if(heroTimer) clearInterval(heroTimer); document.getElementById('hero').style.display='none'; }
            function showHero(){ document.getElementById('hero').style.display='block'; }

            function createPageHeader(title, icon, subtitle) {
                const header = document.createElement('div');
                header.className = 'page-header';
                header.innerHTML = `<div class="breadcrumb"><a href="/" data-route="home">Home</a> <span>›</span> <span class="current">${title}</span></div><h1 class="page-title"><i class="fas ${icon}"></i> ${title}</h1><p class="page-subtitle">${subtitle}</p>`;
                header.querySelector('[data-route="home"]').addEventListener('click', (e) => { e.preventDefault(); navigateTo('home'); });
                return header;
            }

            function createRowSection(cfg){
                const sec=document.createElement('div'); sec.className='section';
                sec.innerHTML=`<h2 class="section-title">${cfg.title}</h2><div class="row-scroll-area"><button class="scroll-btn left"><i class="fas fa-chevron-left"></i></button><div class="row-track" id="grid-${cfg.key}"></div><button class="scroll-btn right"><i class="fas fa-chevron-right"></i></button></div>`;
                const track = sec.querySelector('.row-track');
                sec.querySelector('.scroll-btn.left').addEventListener('click', () => track.scrollBy({ left: -track.clientWidth * 0.85, behavior: 'smooth' }));
                sec.querySelector('.scroll-btn.right').addEventListener('click', () => track.scrollBy({ left: track.clientWidth * 0.85, behavior: 'smooth' }));
                return sec;
            }

            async function renderHome(){
                teardownWall(); showHero(); currentRoute = 'home';
                const container=document.getElementById('sectionsContainer'); container.innerHTML='';
                document.getElementById('mainContent').classList.remove('no-hero');
                HOME_ROWS.forEach(c=>container.appendChild(createRowSection(c)));
                renderContinueWatching();
                const proms=HOME_ROWS.map(async c=>{ try{ const d=await tmdbFetch(c.ep+'1'); return {cfg:c, data:(d.results||[]).filter(m=>m.poster_path||m.backdrop_path)}; } catch(e){ return {cfg:c, data:[]}; } });
                const results=await Promise.all(proms);
                results.forEach(r=>{ const grid=document.getElementById('grid-'+r.cfg.key); if(!grid) return; r.data.slice(0,18).forEach(m=>{ const card=createCard(m, r.cfg.type); if(card) grid.appendChild(card); }); });
                const heroRow = results.find(r=>r.cfg.hero);
                if(heroRow && heroRow.data.length) buildHero(heroRow.data); else hideHero();
                updateNavActive('home');
            }

            function teardownWall(){ if(wallState && wallState.observer) wallState.observer.disconnect(); wallState = null; }

            async function renderWall(catKey){
                teardownWall(); hideHero();
                const routeMap = { movies: 'movies', tv: 'series', new: 'new' };
                currentRoute = routeMap[catKey] || catKey;
                const cfg = WALLS[catKey];
                const container=document.getElementById('sectionsContainer');
                document.getElementById('mainContent').classList.add('no-hero');
                container.innerHTML = '';
                container.appendChild(createPageHeader(cfg.title, cfg.icon, cfg.subtitle));
                const sec = document.createElement('div'); sec.className = 'section';
                sec.innerHTML = `<div class="grid-wall" id="wallGrid"></div><div style="text-align:center;padding:20px;color:var(--text-dim);"><i class="fas fa-circle-notch fa-spin"></i> Loading...</div>`;
                container.appendChild(sec);
                wallState = { page:0, ep:cfg.ep, type:cfg.type, loading:false, ended:false };
                await loadWallPage();
                updateNavActive(currentRoute);
            }
            async function loadWallPage(){
                if(!wallState || wallState.loading || wallState.ended) return;
                wallState.loading = true;
                const grid=document.getElementById('wallGrid');
                const page = wallState.page + 1;
                try{
                    const data = await tmdbFetch(wallState.ep + page);
                    const results = (data.results||[]).filter(m=>m.poster_path);
                    if(results.length){
                        results.forEach(m=>{ const t = wallState.type === 'mixed' ? getMediaType(m, null) : wallState.type; const card = createCard(m, t); if(card) grid.appendChild(card); });
                        wallState.page = page;
                        if(page >= (data.total_pages||1)) wallState.ended=true;
                    } else wallState.ended = true;
                }catch(e){ wallState.ended = true; }
                wallState.loading = false;
            }

            async function renderAnimePage(){
                teardownWall(); hideHero(); currentRoute = 'anime';
                const container = document.getElementById('sectionsContainer');
                document.getElementById('mainContent').classList.add('no-hero');
                container.innerHTML = '';
                container.appendChild(createPageHeader('Anime', 'fa-dragon', 'Discover trending and popular anime'));
                const searchSection = document.createElement('div');
                searchSection.innerHTML = `
                    <div style="max-width:600px;margin:0 auto;padding:20px;">
                        <div style="position:relative;">
                            <input type="text" id="animeSearchInput" placeholder="Search anime..." style="width:100%;padding:16px 50px 16px 20px;background:rgba(30,30,36,0.9);border:2px solid rgba(255,107,157,0.3);border-radius:50px;color:#fff;font-size:1.1rem;outline:none;">
                            <button id="animeSearchBtn" style="position:absolute;right:5px;top:50%;transform:translateY(-50%);width:45px;height:45px;border-radius:50%;background:#ff6b9d;border:none;color:white;cursor:pointer;"><i class="fas fa-search"></i></button>
                        </div>
                    </div>
                    <div class="grid-wall" id="animeGrid"></div>`;
                container.appendChild(searchSection);
                
                const animeGrid = document.getElementById('animeGrid');
                const animeSearchInput = document.getElementById('animeSearchInput');
                
                async function loadAnime(search = '') {
                    animeGrid.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-muted);"><i class="fas fa-spinner fa-spin"></i> Loading anime...</div>';
                    const query = search ? `
                        query ($search: String) { Page(perPage: 20) { media(type: ANIME, search: $search, isAdult: false) { id title { romaji english } coverImage { large } format episodes averageScore seasonYear } } }` : `
                        query { Page(perPage: 20) { media(type: ANIME, sort: TRENDING_DESC, isAdult: false) { id title { romaji english } coverImage { large } format episodes averageScore seasonYear } } }`;
                    const variables = search ? { search } : {};
                    try {
                        const response = await fetch('https://graphql.anilist.co', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                            body: JSON.stringify({ query, variables })
                        });
                        const data = await response.json();
                        const media = data?.data?.Page?.media || [];
                        animeGrid.innerHTML = '';
                        media.forEach(anime => {
                            const title = anime.title?.english || anime.title?.romaji || 'Untitled';
                            const score = anime.averageScore ? (anime.averageScore / 10).toFixed(1) : '?';
                            const cover = anime.coverImage?.large || '';
                            const card = document.createElement('a');
                            card.className = 'card';
                            card.href = 'javascript:void(0)';
                            card.innerHTML = `
                                <div class="card-thumb">
                                    <img src="${cover}" loading="lazy" alt="${esc(title)}" onerror="this.style.background='#1a1a20';this.style.opacity='0';">
                                    <div class="card-rating"><i class="fas fa-star"></i>${score}</div>
                                    <div class="card-overlay">
                                        <div class="card-name">${esc(title)}</div>
                                        <div class="card-sub"><span>${anime.format || 'ANIME'}</span><span>${anime.episodes || '?'} eps</span></div>
                                        <div class="card-buttons">
                                            <button class="circle-btn play-btn"><i class="fas fa-play"></i></button>
                                        </div>
                                    </div>
                                </div>`;
                            card.addEventListener('click', (e) => {
                                e.preventDefault();
                                if (anime.format === 'MOVIE') window.location.href = `/player.html?id=${anime.id}&type=anime-movie`;
                                else window.location.href = `/player.html?id=${anime.id}&type=anime-show&e=1`;
                            });
                            animeGrid.appendChild(card);
                        });
                    } catch(e) {
                        animeGrid.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-muted);">Failed to load anime</div>';
                    }
                }
                
                loadAnime();
                let animeSearchTimeout;
                animeSearchInput.addEventListener('input', function() {
                    clearTimeout(animeSearchTimeout);
                    animeSearchTimeout = setTimeout(() => loadAnime(this.value.trim()), 400);
                });
                document.getElementById('animeSearchBtn').addEventListener('click', () => loadAnime(animeSearchInput.value.trim()));
                
                updateNavActive('anime');
            }

            function renderMyList(){
                teardownWall(); hideHero(); currentRoute = 'my-list';
                const container = document.getElementById('sectionsContainer');
                document.getElementById('mainContent').classList.add('no-hero');
                container.innerHTML = '';
                container.appendChild(createPageHeader('My List', 'fa-bookmark', 'Your saved movies and TV shows'));
                if (watchlist.length === 0) { container.innerHTML += `<div class="empty-state"><i class="fas fa-heart"></i><h2>Your list is empty</h2></div>`; updateNavActive('my-list'); return; }
                const sec = document.createElement('div'); sec.className = 'section';
                sec.innerHTML = `<div class="grid-wall" id="grid-mylist"></div>`;
                container.appendChild(sec);
                const grid = document.getElementById('grid-mylist');
                watchlist.forEach(item => { const card=createCard({ id:item.id, title:item.title, poster_path:null, release_date:(item.year||'')+'-01-01', vote_average:0 }, item.type); if(!card) return; const img=card.querySelector('img'); if(item.poster) img.src=item.poster; grid.appendChild(card); });
                updateNavActive('my-list');
            }

            function renderSearchPage(){
                teardownWall(); hideHero(); currentRoute = 'search';
                const container = document.getElementById('sectionsContainer');
                document.getElementById('mainContent').classList.add('no-hero');
                container.innerHTML = '';
                container.appendChild(createPageHeader('Search', 'fa-search', 'Find movies and TV shows'));
                const searchSection = document.createElement('div');
                searchSection.innerHTML = `
                    <div style="max-width:600px;margin:0 auto;padding:20px;">
                        <div style="position:relative;">
                            <input type="text" id="pageSearchInput" placeholder="Search movies, TV shows..." style="width:100%;padding:16px 50px 16px 20px;background:rgba(30,30,36,0.9);border:2px solid rgba(255,255,255,0.1);border-radius:50px;color:#fff;font-size:1.1rem;outline:none;">
                            <button id="pageSearchBtn" style="position:absolute;right:5px;top:50%;transform:translateY(-50%);width:45px;height:45px;border-radius:50%;background:var(--red);border:none;color:white;cursor:pointer;"><i class="fas fa-arrow-right"></i></button>
                        </div>
                    </div>
                    <div class="grid-wall" id="pageSearchResults"></div>`;
                container.appendChild(searchSection);
                const searchInput = document.getElementById('pageSearchInput');
                const searchBtn = document.getElementById('pageSearchBtn');
                const searchResults = document.getElementById('pageSearchResults');
                let searchTimeout;
                function performSearch() {
                    const query = searchInput.value.trim();
                    if (query.length < 2) { searchResults.innerHTML = ''; return; }
                    tmdbFetch(`/search/multi?query=${encodeURIComponent(query)}&page=1`).then(data => {
                        const items = (data.results || []).filter(m => m.poster_path);
                        searchResults.innerHTML = '';
                        items.forEach(item => {
                            const card = createCard(item, item.media_type || 'movie');
                            if (card) searchResults.appendChild(card);
                        });
                    });
                }
                searchInput.addEventListener('input', () => { clearTimeout(searchTimeout); searchTimeout = setTimeout(performSearch, 400); });
                searchBtn.addEventListener('click', performSearch);
                updateNavActive('search');
            }

            function render404() {
                teardownWall(); hideHero(); currentRoute = '404';
                const container = document.getElementById('sectionsContainer');
                document.getElementById('mainContent').classList.add('no-hero');
                container.innerHTML = `<div class="not-found-container"><div class="not-found-code">404</div><h1>Page Not Found</h1><a href="/" class="not-found-btn">Back to Home</a></div>`;
                updateNavActive('');
            }

            function updateNavActive(route) {
                document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
                document.querySelectorAll('.bottom-nav-item').forEach(a => a.classList.remove('active'));
                document.querySelectorAll(`[data-route="${route}"]`).forEach(a => a.classList.add('active'));
            }

            function handleRoute(route) {
                if (route === 'home') renderHome();
                else if (route === 'anime') renderAnimePage();
                else if (route === 'movies') renderWall('movies');
                else if (route === 'series') renderWall('tv');
                else if (route === 'new') renderWall('new');
                else if (route === 'my-list') renderMyList();
                else if (route === 'search') renderSearchPage();
                else render404();
                window.scrollTo({ top: 0 });
            }

            function navigateTo(route) {
                const routeMap = { 'home': '/', 'anime': '/anime', 'movies': '/movies', 'series': '/series', 'new': '/new', 'my-list': '/my-list', 'search': '/search' };
                window.history.pushState({ route }, '', routeMap[route] || '/');
                handleRoute(route);
            }

            document.querySelectorAll('.nav-links a, .bottom-nav-item').forEach(link => {
                link.addEventListener('click', (e) => { e.preventDefault(); navigateTo(link.dataset.route); });
            });
            document.querySelector('.nav-logo').addEventListener('click', (e) => { e.preventDefault(); navigateTo('home'); });
            
            const backBtn = document.getElementById('backToTop');
            window.addEventListener('scroll', () => { backBtn.classList.toggle('visible', window.scrollY > 600); });
            backBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
            document.getElementById('watchlistBtnNav').addEventListener('click', () => navigateTo('my-list'));
            document.getElementById('clearRecentBtn')?.addEventListener('click', () => { recent = []; saveRec(); renderContinueWatching(); });
            
            window.addEventListener('popstate', (e) => {
                const route = e.state?.route || 'home';
                handleRoute(route);
            });

            function getRouteFromPath(path) {
                if (path === '/anime') return 'anime';
                if (path === '/movies') return 'movies';
                if (path === '/series') return 'series';
                if (path === '/new') return 'new';
                if (path === '/my-list') return 'my-list';
                if (path === '/search') return 'search';
                if (path === '/') return 'home';
                return '404';
            }

            async function init() {
                loadStorage();
                updateWatchlistBadge();
                if (watchlist.length > 0) document.getElementById('watchlistBtnNav').querySelector('i').className = 'fas fa-heart';
                await loadConfiguration();
                const path = window.location.pathname;
                currentRoute = getRouteFromPath(path);
                await handleRoute(currentRoute);
                setTimeout(() => { 
                    document.getElementById('loadingScreen').classList.add('hidden'); 
                    setTimeout(() => document.getElementById('loadingScreen').remove(), 600); 
                }, 2600);
                refreshHearts();
            }
            init();
        })();
    </script>
</body>
</html>
